    // --- CONSTANTS & INITIAL DATA ---
    const DAYS = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
    const DAY_LABELS_SHORT = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
    const RECIPE_CATEGORIES = ['Frühstück', 'Snack', 'Hauptspeise'];

    // --- WOCHENPLAN: Datums-Helfer ---
    // Der Wochenplan ist an echte Kalenderdaten gebunden (statt an abstrakte Wochentage), damit er sich
    // von selbst aktualisiert: "diese" und "nächste" Woche werden bei jedem Aufruf neu aus dem aktuellen
    // Datum berechnet, es gibt also keinen separaten "Woche wechseln"-Schritt.
    function getMonday(date) {
      const d = new Date(date);
      const day = d.getDay(); // 0=So, 1=Mo, ..., 6=Sa
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      d.setHours(0, 0, 0, 0);
      return d;
    }
    function addDays(date, n) {
      const d = new Date(date);
      d.setDate(d.getDate() + n);
      return d;
    }
    function formatISODate(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }
    function formatShortDate(date) {
      return `${String(date.getDate()).padStart(2, '0')}.${String(date.getMonth() + 1).padStart(2, '0')}.`;
    }
    // Zerlegt eine Zutat ("150 g Blattspinat") in Menge, Einheit und Name. Gewicht/Volumen wird auf g bzw. ml
    // normalisiert, damit "1 kg" und "500 g" zusammengerechnet werden können. Ohne erkennbare Menge ist amount null.
    const UNIT_MAP = {
      g: ['g', 1], gr: ['g', 1], gramm: ['g', 1], kg: ['g', 1000],
      ml: ['ml', 1], cl: ['ml', 10], l: ['ml', 1000], liter: ['ml', 1000],
      el: ['EL', 1], esslöffel: ['EL', 1], tl: ['TL', 1], teelöffel: ['TL', 1],
      stk: ['Stk', 1], 'stk.': ['Stk', 1], stück: ['Stk', 1], st: ['Stk', 1],
      prise: ['Prise', 1], prisen: ['Prise', 1], bund: ['Bund', 1], dose: ['Dose', 1], dosen: ['Dose', 1],
      pck: ['Pck', 1], 'pck.': ['Pck', 1], pkg: ['Pck', 1], packung: ['Pck', 1], päckchen: ['Pck', 1],
      zehe: ['Zehe', 1], zehen: ['Zehe', 1], scheibe: ['Scheibe', 1], scheiben: ['Scheibe', 1],
      becher: ['Becher', 1], tasse: ['Tasse', 1], tassen: ['Tasse', 1],
    };
    const UNICODE_FRACTIONS = { '½': 0.5, '¼': 0.25, '¾': 0.75, '⅓': 1 / 3, '⅔': 2 / 3 };
    function parseIngredient(text) {
      const raw = (text || '').trim();
      const m = raw.match(/^(\d+\s*\/\s*\d+|\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?|[½¼¾⅓⅔])\s*(.*)$/);
      let amount = null, unit = '', rest = raw;
      if (m) {
        const num = m[1];
        if (UNICODE_FRACTIONS[num]) amount = UNICODE_FRACTIONS[num];
        else if (num.includes('/')) { const [a, b] = num.split('/').map(Number); amount = b ? a / b : null; }
        else amount = parseFloat(num.split(/[-–]/).pop().trim().replace(',', '.'));
        rest = m[2];
        const um = rest.match(/^(\S+)\s*(.*)$/);
        const def = um && UNIT_MAP[um[1].toLowerCase()];
        if (def) { unit = def[0]; amount *= def[1]; rest = um[2]; }
        if (!isFinite(amount)) { amount = null; unit = ''; rest = raw; }
      }
      const name = rest.trim();
      const key = name.replace(/\([^)]*\)/g, '').split(',')[0].trim().toLowerCase();
      return { amount, unit, name, key };
    }
    function formatAmount(amount, unit) {
      let a = amount, u = unit;
      if (u === 'g' && a >= 1000) { a /= 1000; u = 'kg'; }
      else if (u === 'ml' && a >= 1000) { a /= 1000; u = 'l'; }
      const num = String(Math.round(a * 100) / 100).replace('.', ',');
      return u ? `${num} ${u}` : num;
    }
    // Menge dieser Zutat, die bereits (noch offen) im Einkaufswagen liegt
    function amountInCart(shoppingList, ingredient) {
      const p = parseIngredient(ingredient);
      if (p.amount === null || !p.key) return 0;
      return shoppingList.reduce((sum, item) => {
        if (item.checked) return sum;
        const q = item.key !== undefined ? item : parseIngredient(item.text);
        return q.amount !== null && q.key === p.key && q.unit === p.unit ? sum + q.amount : sum;
      }, 0);
    }
    // Ehemalige Beispielrezepte, die bei Bestandsnutzern noch in localStorage liegen können
    const LEGACY_SEED_TITLES = { '1': 'Haferschleim mit Beeren', '2': 'Spaghetti Bolognese' };

      'fleisch': 'Fleisch & Fisch', 'hackfleisch': 'Fleisch & Fisch', 'fisch': 'Fleisch & Fisch', 'lachs': 'Fleisch & Fisch', 'hähnchen': 'Fleisch & Fisch', 'wurst': 'Fleisch & Fisch',

      'wasser': 'Getränke', 'saft': 'Getränke', 'wein': 'Getränke', 'bier': 'Getränke', 'cola': 'Getränke'
    };

    // --- LOCAL STORAGE HELPERS ---
    const loadData = (key, defaultData) => {
      try { const item = window.localStorage.getItem(key); return item ? JSON.parse(item) : defaultData; }
      catch (error) { return defaultData; }
    };
    const saveData = (key, data) => {
      try { window.localStorage.setItem(key, JSON.stringify(data)); } catch (error) {}
    };

    // --- GEMINI AI HELPERS ---
    const GEMINI_MODELS = [
      { id: 'gemini-2.5-flash-lite', label: 'Flash-Lite (am günstigsten)' },
      { id: 'gemini-2.5-flash', label: 'Flash (empfohlen)' },
      { id: 'gemini-2.5-pro', label: 'Pro (beste Qualität, teurer)' },
    ];

    const RECIPE_SCHEMA = {
      type: 'OBJECT',
      properties: {
        title: { type: 'STRING' },
        category: { type: 'STRING', enum: RECIPE_CATEGORIES },
        time: { type: 'STRING' },
        ingredients: { type: 'ARRAY', items: { type: 'STRING' } },
        instructions: { type: 'STRING' },
        // Kleinteilige Zerlegung für den Guided Cooking Mode: atomare Teilschritte mit exakten
        // Zutaten-Referenzen (Substrings aus "ingredients") und optionaler Timer-Dauer.
        guidedSteps: {
          type: 'ARRAY',
          items: {
            type: 'OBJECT',
            properties: {
              text: { type: 'STRING' },
              ingredients: { type: 'ARRAY', items: { type: 'STRING' } },
              timerMinutes: { type: 'NUMBER' },
            },
            required: ['text', 'ingredients'],
          },
        },
      },
      required: ['title', 'category', 'ingredients', 'instructions'],
    };

    const CATEGORY_SCHEMA = {
      type: 'OBJECT',
      properties: { category: { type: 'STRING', enum: DEFAULT_SHOPPING_CATEGORIES } },
      required: ['category'],
    };

    const SCALE_INGREDIENTS_SCHEMA = {
      type: 'OBJECT',
      properties: { ingredients: { type: 'ARRAY', items: { type: 'STRING' } } },
      required: ['ingredients'],
    };

    // Diese Statuscodes bedeuten meist eine kurzzeitige Überlastung bei Google (z.B. "high demand")
    // und lohnen sich für einen automatischen Retry mit Backoff, statt sofort aufzugeben.
    const GEMINI_RETRYABLE_STATUS = [429, 500, 503];

    async function callGemini(apiKey, model, prompt, schema, imagePart, attempt = 0) {
      if (!apiKey) throw new Error('Kein Gemini API-Key hinterlegt.');
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);
      let res;
      try {
        // Key als Header statt als ?key=-Query-Parameter, damit er nicht in Browser-History/Logs landet.
        res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
          body: JSON.stringify({
            contents: [{ role: 'user', parts: imagePart ? [imagePart, { text: prompt }] : [{ text: prompt }] }],
            generationConfig: { responseMimeType: 'application/json', responseSchema: schema },
          }),
          signal: controller.signal,
        });
      } catch (e) {
        clearTimeout(timeoutId);
        if (e.name === 'AbortError') throw new Error('Zeitüberschreitung: Gemini hat nicht rechtzeitig geantwortet.');
        throw new Error('Gemini konnte nicht erreicht werden (Netzwerkfehler).');
      }
      clearTimeout(timeoutId);
      if (!res.ok) {
        if (GEMINI_RETRYABLE_STATUS.includes(res.status) && attempt < 2) {
          await new Promise(r => setTimeout(r, 1000 * Math.pow(2, attempt))); // 1s, dann 2s
          return callGemini(apiKey, model, prompt, schema, imagePart, attempt + 1);
        }
        let detail = '';
        try { const errJson = await res.json(); detail = errJson?.error?.message || ''; } catch (e) {}
        const readable = res.status === 503 ? 'Gemini ist gerade überlastet. Bitte in Kürze erneut versuchen.' : (detail || `Gemini-Anfrage fehlgeschlagen (${res.status})`);
        throw new Error(readable);
      }
      const data = await res.json();
      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error('Gemini hat keine Antwort geliefert.');
      try {
        return JSON.parse(text);
      } catch (e) {
        throw new Error('Gemini hat eine unvollständige oder ungültige Antwort geliefert. Bitte erneut versuchen.');
      }
    }

    // Liest eine Bilddatei als Base64 und baut den inlineData-Part fürs Gemini-Vision-Input.
    // Ungetestet gegen die echte API (Google-Domains in dieser Dev-Sandbox blockiert): Gemini nutzt
    // sonst durchgängig camelCase (generationConfig, responseMimeType) - falls ein 400er kommt, hier
    // testweise auf snake_case (inline_data / mime_type) umstellen.
    const fileToImagePart = (file) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = String(reader.result).split(',')[1];
        resolve({ inlineData: { mimeType: file.type || 'image/jpeg', data: base64 } });
      };
      reader.onerror = () => reject(new Error('Bild konnte nicht gelesen werden.'));
      reader.readAsDataURL(file);
    });

    // Sorgt dafür, dass die KI die Zubereitung in kurze Einzelschritte statt Fließtext gliedert und
    // Geräteeinstellungen (Temperatur, Stufe, Zeit) konkret benennt, damit sie sich später hervorheben lassen.
    const RECIPE_FORMAT_GUIDANCE = 'Formuliere die Zubereitung (instructions) als klare Einzelschritte: pro Zeile genau ein kurzer, in sich abgeschlossener Schritt (1-2 Sätze) - kein zusammenhängender Fließtext. Nenne Geräteeinstellungen konkret und einheitlich (z.B. "Backofen 200°C Ober-/Unterhitze", "Herd Stufe 6", "10 Minuten backen"). Fülle zusätzlich "guidedSteps": Zerlege das Rezept dort in noch kleinteiligere, atomare Arbeitsschritte (z.B. "Kartoffeln schälen" und "Kartoffeln kochen" als zwei getrennte Einträge statt einem). Ordne die guidedSteps so an, dass Schritte, deren Ergebnis später gebraucht wird (z.B. Wasser aufsetzen), vor den Schritten stehen, die darauf aufbauen. Gib bei jedem guidedSteps-Eintrag in "ingredients" die in genau diesem Teilschritt tatsächlich benötigte Menge einer Zutat an, nicht die Gesamtmenge aus der obigen ingredients-Liste (z.B. "etwas Butter zum Anbraten" oder "50g Butter", wenn von den insgesamt 150g Butter im Rezept in diesem Schritt nur ein Teil gebraucht wird) - leeres Array, falls in diesem Schritt keine Zutat gebraucht wird. Setze "timerMinutes" nur, wenn der Schritt eine klare Warte-/Kochzeit in Minuten hat.';

    const RECIPE_COMPLEXITY_PROMPTS = {
      quick: 'Schwierigkeitsgrad: Quick & Easy. Halte das Rezept bewusst einfach und schnell: möglichst wenige Zutaten, unkomplizierte Standardschritte, insgesamt nicht mehr als ca. 25 Minuten Zeitaufwand.',
      normal: 'Schwierigkeitsgrad: Normal. Es darf auch etwas aufwendiger sein, wenn es dem Gericht angemessen ist.',
    };

    const buildRecipePrompt = (dishName, servings, complexity) => `Erstelle ein Kochrezept für "${dishName}"${servings ? ` für ${servings} Portionen` : ''} auf Deutsch. ${RECIPE_COMPLEXITY_PROMPTS[complexity] || ''} Gib realistische Mengenangaben bei den Zutaten an (z.B. "200g Mehl"), passend zur Portionsanzahl. ${RECIPE_FORMAT_GUIDANCE} Trenne die Zubereitungsschritte durch Zeilenumbrüche, ohne sie selbst zu nummerieren. Die Kategorie muss exakt einer dieser Werte sein: ${RECIPE_CATEGORIES.join(', ')}.`;

    const buildImprovePrompt = (recipe, customInstruction) => `Verbessere folgendes Rezept. Antworte auf Deutsch.\nTitel: ${recipe.title}\nKategorie: ${recipe.category}\nZeit: ${recipe.time || ''}\nZutaten:\n${(recipe.ingredients || []).join('\n')}\nZubereitung:\n${recipe.instructions || ''}\n${customInstruction ? `Berücksichtige dabei besonders diesen Wunsch: ${customInstruction}` : 'Mache Zutatenmengen realistischer, die Zubereitung klarer und behebe Ungereimtheiten.'}\n${RECIPE_FORMAT_GUIDANCE}\nDie Kategorie muss exakt einer dieser Werte sein: ${RECIPE_CATEGORIES.join(', ')}.`;

    const buildCategoryPrompt = (ingredientText) => `Ordne die Einkaufsliste-Zutat "${ingredientText}" genau einer dieser Kategorien zu: ${DEFAULT_SHOPPING_CATEGORIES.join(', ')}. Antworte ausschließlich mit der Kategorie.`;

    const buildPasteExtractPrompt = (pasteText) => `Extrahiere ein Kochrezept aus folgendem eingefügten Text (z.B. von einer Kochseite oder aus einem Kochbuch kopiert). Antworte auf Deutsch. Gib realistische Mengenangaben bei den Zutaten an. ${RECIPE_FORMAT_GUIDANCE} Trenne die Zubereitungsschritte durch Zeilenumbrüche, ohne sie selbst zu nummerieren. Die Kategorie muss exakt einer dieser Werte sein: ${RECIPE_CATEGORIES.join(', ')}.\n\nText:\n${pasteText}`;

    const buildPhotoExtractPrompt = () => `Auf diesem Bild ist ein Kochrezept (z.B. aus einem Kochbuch oder handschriftlich). Extrahiere Titel, Zutaten und Zubereitung. Antworte auf Deutsch. Gib realistische Mengenangaben bei den Zutaten an. ${RECIPE_FORMAT_GUIDANCE} Trenne die Zubereitungsschritte durch Zeilenumbrüche, ohne sie selbst zu nummerieren. Die Kategorie muss exakt einer dieser Werte sein: ${RECIPE_CATEGORIES.join(', ')}.`;

    const buildScalePrompt = (ingredients, factorLabel) => `Skaliere die folgende Zutatenliste eines Rezepts ${factorLabel}. Runde auf realistische, küchentaugliche Mengen (z.B. "1,5 EL" statt krummer Dezimalzahlen). Behalte Reihenfolge und Wortlaut so weit wie möglich bei, ändere nur die Mengenangaben. Antworte auf Deutsch.\nZutaten:\n${ingredients.join('\n')}`;

    function App() {
      // States initializing from LocalStorage
      const [recipes, setRecipes] = useState(() =>
        loadData('rm_recipes', []).filter(r => LEGACY_SEED_TITLES[r.id] !== r.title)
      );
      const [shoppingList, setShoppingList] = useState(() => loadData('rm_shoppingList', []));
      const [categoryOrder, setCategoryOrder] = useState(() => loadData('rm_categoryOrder', DEFAULT_SHOPPING_CATEGORIES));
      const [learnedCategories, setLearnedCategories] = useState(() => loadData('rm_learnedCategories', {}));
      // Wochenplan ist ein flaches Objekt, keyed nach ISO-Datum (z.B. "2026-07-13") statt nach Wochentag -
      // so lassen sich "diese" und "nächste" Woche jederzeit aus dem aktuellen Datum ableiten. Ältere,
      // nach Wochentagsnamen gekeyte Pläne (vor diesem Umbau) lassen sich keinem echten Datum mehr sicher
      // zuordnen und werden daher verworfen statt fehlerhaft migriert.
      const [weeklyPlan, setWeeklyPlan] = useState(() => {
        const raw = loadData('rm_weeklyPlan', {});
        const isLegacyFormat = raw && DAYS.some(d => Object.prototype.hasOwnProperty.call(raw, d));
        return isLegacyFormat ? {} : raw;
      });
      const [geminiApiKey, setGeminiApiKey] = useState(() => loadData('rm_geminiApiKey', ''));
      const [geminiModel, setGeminiModel] = useState(() => loadData('rm_geminiModel', GEMINI_MODELS[1].id));

      const [activeTab, setActiveTab] = useState('recipes');
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [editingRecipe, setEditingRecipe] = useState(null);
      const [isAiSettingsOpen, setIsAiSettingsOpen] = useState(false);
      const [selectedRecipe, setSelectedRecipe] = useState(null);

      const activeRecipe = selectedRecipe ? (recipes.find(r => r.id === selectedRecipe.id) || null) : null;

      // Save to LocalStorage on change
      useEffect(() => { saveData('rm_recipes', recipes); }, [recipes]);
      useEffect(() => { saveData('rm_shoppingList', shoppingList); }, [shoppingList]);
      useEffect(() => { saveData('rm_categoryOrder', categoryOrder); }, [categoryOrder]);
      useEffect(() => { saveData('rm_learnedCategories', learnedCategories); }, [learnedCategories]);
      useEffect(() => { saveData('rm_weeklyPlan', weeklyPlan); }, [weeklyPlan]);
      useEffect(() => { saveData('rm_geminiApiKey', geminiApiKey); }, [geminiApiKey]);
      useEffect(() => { saveData('rm_geminiModel', geminiModel); }, [geminiModel]);

      const guessCategory = (ingredientText) => {
        if (learnedCategories[ingredientText]) return learnedCategories[ingredientText];
        const lowerText = ingredientText.toLowerCase();
        for (const [keyword, category] of Object.entries(SMART_KEYWORDS)) {
          const wordBoundary = new RegExp(`(^|[^a-zäöüß])${keyword}([^a-zäöüß]|$)`, 'i');
          if (wordBoundary.test(lowerText)) return category;
        }
        return 'Sonstiges';
      };

      const saveRecipe = (recipeData) => {
        if (recipeData.id) {
          setRecipes(prev => prev.map(r => r.id === recipeData.id ? { ...r, ...recipeData } : r));
        } else {
          setRecipes(prev => [{ ...recipeData, id: Date.now().toString(), rating: 0 }, ...prev]);
        }
        setIsAddModalOpen(false);
        setEditingRecipe(null);
      };

      const openAddRecipeModal = () => { setEditingRecipe(null); setIsAddModalOpen(true); };
      const openEditRecipeModal = (recipe) => { setEditingRecipe(recipe); setIsAddModalOpen(true); };
      const closeRecipeModal = () => { setIsAddModalOpen(false); setEditingRecipe(null); };

      const rateRecipe = (id, rating) => {
        setRecipes(prev => prev.map(r => r.id === id ? { ...r, rating } : r));
      };

      const persistScaledIngredients = (id, newIngredients) => {
        setRecipes(prev => prev.map(r => r.id === id ? { ...r, ingredients: newIngredients } : r));
      };

      const deleteRecipe = (id) => {
        setRecipes(prev => prev.filter(r => r.id !== id));
        if (selectedRecipe && selectedRecipe.id === id) setSelectedRecipe(null);
      };

      // Backup als Download (kein API-Key darin, damit eine geteilte/verlorene Backup-Datei ihn nicht preisgibt)
      const exportBackup = () => {
        const backup = { exportedAt: new Date().toISOString(), recipes, shoppingList, categoryOrder, learnedCategories, weeklyPlan };
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `rezept-meister-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      };

      const importBackup = (file) => {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(String(reader.result));
            if (!Array.isArray(data.recipes)) throw new Error('Ungültiges Backup-Format.');
            if (!window.confirm('Backup importieren? Das ersetzt deine aktuellen Rezepte, die Einkaufsliste und den Wochenplan auf diesem Gerät.')) return;
            setRecipes(data.recipes || []);
            setShoppingList(data.shoppingList || []);
            setCategoryOrder(data.categoryOrder || DEFAULT_SHOPPING_CATEGORIES);
            setLearnedCategories(data.learnedCategories || {});
            setWeeklyPlan(data.weeklyPlan || {});
            setSelectedRecipe(null);
            alert('Backup wurde importiert.');
          } catch (e) {
            alert('Backup konnte nicht gelesen werden: ' + (e.message || 'unbekannter Fehler'));
          }
        };
        reader.readAsText(file);
      };

      // Fragt Gemini im Hintergrund nach einer Kategorie für Zutaten, die der lokale Keyword-Abgleich nicht kennt
      const classifyUnknownItemsWithAI = (itemsToClassify) => {
        if (!geminiApiKey) return;
        itemsToClassify.forEach(({ id, text }) => {
          callGemini(geminiApiKey, geminiModel, buildCategoryPrompt(text), CATEGORY_SCHEMA)
            .then(result => {
              const category = result?.category;
              if (category && DEFAULT_SHOPPING_CATEGORIES.includes(category)) {
                setShoppingList(prev => prev.map(item => item.id === id ? { ...item, category } : item));
                setLearnedCategories(prev => ({ ...prev, [text]: category }));
              }
            })
            .catch(() => { /* Hintergrund-Anreicherung: bei Fehler bleibt die lokale Einordnung bestehen */ });
        });
      };

      // Fügt neue Texte zur Liste hinzu; matcht ein Text (getrimmt, ohne Groß-/Kleinschreibung) bereits eine
      // offene Zeile, wird nur ein Mengen-Zähler erhöht statt eine doppelte Zeile anzulegen.
      const mergeShoppingItems = (currentList, texts) => {
        const result = [...currentList];
        const created = [];
        texts.forEach(text => {
          const p = parseIngredient(text);
          const existingIdx = result.findIndex(i => {
            if (i.checked) return false;
            const q = i.key !== undefined ? i : parseIngredient(i.text);
            if (p.amount === null) return q.amount === null && i.text.trim().toLowerCase() === text.trim().toLowerCase();
            return q.amount !== null && q.key === p.key && q.unit === p.unit;
          });
          if (existingIdx !== -1) {
            const cur = result[existingIdx];
            if (p.amount === null) {
              result[existingIdx] = { ...cur, count: (cur.count || 1) + 1 };
            } else {
              const q = cur.key !== undefined ? cur : parseIngredient(cur.text);
              const total = q.amount + p.amount;
              result[existingIdx] = { ...cur, amount: total, unit: p.unit, name: q.name, key: p.key, text: `${formatAmount(total, p.unit)} ${q.name}` };
            }
          } else {
            const item = { id: Date.now() + Math.random(), text, checked: false, category: guessCategory(text), count: 1, amount: p.amount, unit: p.unit, name: p.name, key: p.key };
            result.push(item);
            created.push(item);
          }
        });
        return { result, created };
      };

      const addToShoppingList = (ingredients) => {
        if (!ingredients || !Array.isArray(ingredients) || ingredients.length === 0) return;
        const { result, created } = mergeShoppingItems(shoppingList, ingredients);
        setShoppingList(result);
        classifyUnknownItemsWithAI(created.filter(i => i.category === 'Sonstiges'));
      };

      const addManualShoppingItem = (text) => {
        if (!text || !text.trim()) return;
        const itemsTextArray = text.replace(/\s+und\s+/gi, ',').split(',').map(item => item.trim()).filter(item => item.length > 0);
        const { result, created } = mergeShoppingItems(shoppingList, itemsTextArray);
        setShoppingList(result);
        classifyUnknownItemsWithAI(created.filter(i => i.category === 'Sonstiges'));
      };

      const toggleShoppingItem = (id) => setShoppingList(prev => prev.map(item => item.id === id ? { ...item, checked: !item.checked } : item));
      const removeShoppingItem = (id) => setShoppingList(prev => prev.filter(item => item.id !== id));

      const changeItemCategory = (id, newCategory, itemText) => {
        setShoppingList(prev => prev.map(item => item.id === id ? { ...item, category: newCategory } : item));
        setLearnedCategories(prev => ({ ...prev, [itemText]: newCategory }));
      };

      const moveCategory = (cat, direction) => {
        setCategoryOrder(prev => {
          const idx = prev.indexOf(cat);
          const newIdx = idx + direction;
          if (idx === -1 || newIdx < 0 || newIdx >= prev.length) return prev;
          const newOrder = [...prev];
          [newOrder[idx], newOrder[newIdx]] = [newOrder[newIdx], newOrder[idx]];
          return newOrder;
        });
      };

      // Füllt nur noch freie Slots einer Woche mit zufälligen, passenden Rezepten - bereits manuell
      // gesetzte Tage bleiben beim erneuten Klick auf "Füllen" erhalten (Löschen geht explizit über
      // "Woche löschen").
      const generateWeekPlan = (dateStrs) => {
        setWeeklyPlan(prev => {
          const next = { ...prev };
          dateStrs.forEach(dateStr => {
            const dayPlan = { ...(next[dateStr] || {}) };
            RECIPE_CATEGORIES.forEach(cat => {
              if (dayPlan[cat]) return;
              const catRecipes = recipes.filter(r => r.category === cat);
              dayPlan[cat] = catRecipes.length > 0 ? catRecipes[Math.floor(Math.random() * catRecipes.length)] : null;
            });
            next[dateStr] = dayPlan;
          });
          return next;
        });
      };

      // value: Rezept-ID, leer für "Frei" oder { freeText } für einen eigenen Eintrag
      const updateWeeklyPlanItem = (dateStr, category, value) => {
        let recipe = null;
        if (value && typeof value === 'object') {
          const title = (value.freeText || '').trim();
          if (title) recipe = { id: `free-${Date.now()}`, title, category, isFree: true, ingredients: [] };
        } else if (value) {
          recipe = recipes.find(r => r.id === value) || null;
        }
        setWeeklyPlan(prev => ({ ...prev, [dateStr]: { ...prev[dateStr], [category]: recipe } }));
      };

      const deleteWeekPlan = (dateStrs) => {
        setWeeklyPlan(prev => {
          const next = { ...prev };
          dateStrs.forEach(dateStr => { delete next[dateStr]; });
          return next;
        });
      };

      // Bottom Navigation for Mobile
      const NavItemMobile = ({ active, onClick, icon, label, badge }) => (
        <button onClick={onClick} className={`flex flex-col items-center justify-center w-full py-2 ${active ? 'text-emerald-600' : 'text-gray-500'}`}>
          <div className="relative">
            {icon}
            {badge > 0 && <span className="absolute -top-2 -right-3 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">{badge}</span>}
          </div>
          <span className="text-[10px] mt-1 font-medium">{label}</span>
        </button>
      );

      return (
        <div className="min-h-screen bg-gray-50 flex flex-col md:flex-row text-gray-800 pb-24 md:pb-0">

          {/* Desktop Sidebar */}
          <nav className="hidden md:flex w-64 bg-white border-r border-gray-200 p-4 flex-col justify-start shadow-sm z-10 sticky top-0 h-screen shrink-0">
            <div className="flex items-center gap-2 mb-8 text-emerald-600">
              <IconUtensils size={28} />
              <h1 className="text-xl font-bold">Rezept Meister</h1>
            </div>
            <div className="flex flex-col gap-2 w-full">
              <button onClick={() => { setActiveTab('recipes'); setSelectedRecipe(null); }} className={`flex items-center gap-3 p-3 rounded-xl ${activeTab === 'recipes' ? 'bg-emerald-50 text-emerald-700 font-semibold' : 'text-gray-500 hover:bg-gray-100'}`}><IconBook/> Rezepte</button>
              <button onClick={() => { setActiveTab('plan'); setSelectedRecipe(null); }} className={`flex items-center gap-3 p-3 rounded-xl ${activeTab === 'plan' ? 'bg-emerald-50 text-emerald-700 font-semibold' : 'text-gray-500 hover:bg-gray-100'}`}><IconCalendar/> Wochenplan</button>
              <button onClick={() => { setActiveTab('shopping'); setSelectedRecipe(null); }} className={`flex items-center gap-3 p-3 rounded-xl ${activeTab === 'shopping' ? 'bg-emerald-50 text-emerald-700 font-semibold' : 'text-gray-500 hover:bg-gray-100'}`}>
            <IconShoppingCart/> Einkaufsliste
            {shoppingList.filter(i => !i.checked).length > 0 && <span className="ml-auto bg-emerald-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">{shoppingList.filter(i => !i.checked).length}</span>}
          </button>
              <button onClick={() => setIsAiSettingsOpen(true)} className="flex items-center gap-3 p-3 rounded-xl text-gray-500 hover:bg-gray-100">
                <IconSettings/> Einstellungen
              </button>
        </div>
      </nav>

      {/* Mobile Header */}
      <header className="md:hidden bg-white p-4 shadow-sm flex items-center justify-between text-emerald-600 font-bold text-lg sticky top-0 z-10">
        <div className="flex items-center">
          <IconUtensils size={20} className="mr-2" /> Rezept Meister
        </div>
        <div className="flex items-center gap-1">
          <button onClick={() => setIsAiSettingsOpen(true)} aria-label="Einstellungen" className="p-2 -m-1 rounded-full active:bg-gray-100 tap-target text-gray-400">
            <IconSettings size={20} />
          </button>
        </div>
      </header>

      <main className="flex-1 p-4 md:p-8 overflow-y-auto">
            {activeTab === 'recipes' && !activeRecipe && <RecipesOverview recipes={recipes} onAddClick={openAddRecipeModal} onDelete={deleteRecipe} onSelectRecipe={setSelectedRecipe} />}
            {activeTab === 'recipes' && activeRecipe && <RecipeDetail recipe={activeRecipe} shoppingList={shoppingList} onBack={() => setSelectedRecipe(null)} onAddToShoppingList={addToShoppingList} onRate={rateRecipe} onEdit={openEditRecipeModal} onPersistIngredients={persistScaledIngredients} apiKey={geminiApiKey} model={geminiModel} />}
            {activeTab === 'plan' && <WeeklyPlanView plan={weeklyPlan} onGenerateWeek={generateWeekPlan} onDeleteWeek={deleteWeekPlan} recipes={recipes} onUpdateItem={updateWeeklyPlanItem} onAddToShoppingList={addToShoppingList} onOpenRecipe={(r) => { setActiveTab('recipes'); setSelectedRecipe(r); }} />}
            {activeTab === 'shopping' && <ShoppingListView items={shoppingList} categoryOrder={categoryOrder} onToggle={toggleShoppingItem} onRemove={removeShoppingItem} onClear={() => setShoppingList([])} onChangeCategory={changeItemCategory} onMoveCategory={moveCategory} onAddManualItem={addManualShoppingItem} />}
          </main>

          {/* Mobile Bottom Navigation */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around pb-safe z-50">
            <NavItemMobile active={activeTab === 'recipes'} onClick={() => { setActiveTab('recipes'); setSelectedRecipe(null); }} icon={<IconBook/>} label="Rezepte" />
            <NavItemMobile active={activeTab === 'plan'} onClick={() => { setActiveTab('plan'); setSelectedRecipe(null); }} icon={<IconCalendar/>} label="Plan" />
            <NavItemMobile active={activeTab === 'shopping'} onClick={() => { setActiveTab('shopping'); setSelectedRecipe(null); }} icon={<IconShoppingCart/>} label="Einkaufen" badge={shoppingList.filter(i => !i.checked).length} />
          </nav>

          {isAddModalOpen && <AddRecipeModal onClose={closeRecipeModal} onSave={saveRecipe} apiKey={geminiApiKey} model={geminiModel} initialRecipe={editingRecipe} />}
          {isAiSettingsOpen && <SettingsModal apiKey={geminiApiKey} model={geminiModel} onSave={(key, model) => { setGeminiApiKey(key); setGeminiModel(model); }} onExport={exportBackup} onImport={importBackup} onClose={() => setIsAiSettingsOpen(false)} />}
        </div>
      );
    }

    // --- SUBCOMPONENTS ---

    function RecipesOverview({ recipes, onAddClick, onDelete, onSelectRecipe }) {
      const [filter, setFilter] = useState('Alle');
      const [search, setSearch] = useState('');

      const filteredRecipes = useMemo(() => {
        return recipes.filter(r => {
          const matchesFilter = filter === 'Alle' || r.category === filter;
          const matchesSearch = (r.title || '').toLowerCase().includes(search.toLowerCase());
          return matchesFilter && matchesSearch;
        });
      }, [recipes, filter, search]);

      return (
        <div className="max-w-6xl mx-auto flex flex-col h-full animate-in fade-in duration-300">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
            <div><h2 className="text-2xl md:text-3xl font-bold text-gray-900">Meine Rezepte</h2></div>
            <button onClick={onAddClick} className="w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white px-5 py-3 rounded-xl font-medium flex items-center justify-center gap-2 shadow-lg"><IconPlus /> Neues Rezept</button>
          </div>

          <div className="flex flex-col sm:flex-row gap-4 mb-6 justify-between">
            <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
              {['Alle', 'Frühstück', 'Snack', 'Hauptspeise'].map(cat => (
                <button key={cat} onClick={() => setFilter(cat)} className={`px-4 py-2 rounded-full whitespace-nowrap text-sm font-medium border ${filter === cat ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-600 active:bg-gray-100'}`}>{cat}</button>
              ))}
            </div>
            <div className="relative w-full sm:w-64">
              <label htmlFor="recipe-search" className="sr-only">Rezepte durchsuchen</label>
              <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><IconSearch /></span>
              <input id="recipe-search" type="text" placeholder="Suchen..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full pl-10 pr-4 py-2.5 rounded-xl border focus:ring-2 focus:ring-emerald-500" />
            </div>
          </div>

          {filteredRecipes.length === 0 ? (
            <div className="flex-1 flex flex-col items-center justify-center text-gray-400 py-12"><IconUtensils size={64} /><p className="mt-4">Keine Rezepte gefunden.</p></div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 pb-10">
              {filteredRecipes.map(recipe => (
                <div key={recipe.id} className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 hover:shadow-md active:shadow-sm cursor-pointer flex flex-col h-full" onClick={() => onSelectRecipe(recipe)}>
                  <div className="flex justify-between items-start mb-3">
                    <span className={`text-xs font-bold uppercase px-2 py-1 rounded-md border ${getCatStyle(recipe.category)}`}>{recipe.category}</span>
                    <button onClick={(e) => { e.stopPropagation(); if (window.confirm(`"${recipe.title}" wirklich löschen?`)) onDelete(recipe.id); }} aria-label={`${recipe.title} löschen`} className="text-gray-300 hover:text-red-500 active:text-red-600 p-2.5 -m-2 rounded-full tap-target"><IconTrash2 /></button>
                  </div>
                  <h3 className="text-lg md:text-xl font-bold text-gray-900 mb-2 line-clamp-2 break-words">{recipe.title}</h3>
                  <div className="flex items-center gap-3 mb-4 flex-wrap">
                    {recipe.time && <div className="flex items-center gap-1 text-sm text-gray-500"><IconClock /> {recipe.time}</div>}
                    {recipe.complexity === 'quick' && <span className="text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded-full">⚡ Quick &amp; Easy</span>}
                    {recipe.rating > 0 && (
                      <div className="flex items-center gap-0.5 text-amber-400">
                        {[1,2,3,4,5].map(n => <IconStar key={n} size={13} filled={recipe.rating >= n} />)}
                      </div>
                    )}
                  </div>
                  <div className="mt-auto pt-4 border-t border-gray-100"><p className="text-sm text-gray-500 line-clamp-2"><span className="font-semibold">Zutaten:</span> {(recipe.ingredients || []).join(', ')}</p></div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // --- REZEPTTEXT-HERVORHEBUNG ---
    // Erkennt Zutaten (aus recipe.ingredients) und Geräte-Einstellungen (Temperatur, Stufe, Zeit) in der
    // Zubereitung und hebt sie farblich hervor, damit die Anleitung auf einen Blick überfliegbar bleibt.
    const INGREDIENT_LINE_STRIP = /^\s*[\d.,\/½¼¾⅓⅔⅛\s]+\s*(g|kg|ml|l|el|tl|prise[n]?|stück|bund|dose[n]?|packung(en)?|zehe[n]?|scheibe[n]?|handvoll|becher|glas|gläser)?\.?\s*/i;
    const INGREDIENT_STOPWORDS = new Set(['und','oder','etwas','frisch','frische','frischer','frisches','nach','geschmack','optional','gehackt','gehackte','gehackter','gehacktes','gewürfelt','gewürfelte','gewürfelter','klein','kleine','großer','große','fein','feine']);

    function extractIngredientKeywords(ingredients) {
      const keywords = new Set();
      (ingredients || []).forEach(ing => {
        const withoutParens = ing.replace(/\([^)]*\)/g, ' ');
        const core = withoutParens.replace(INGREDIENT_LINE_STRIP, '').replace(/,.*$/, '').trim();
        // Ab 2 Zeichen zulassen (z.B. "Ei", "Öl") - die Wortgrenzen-Prüfung beim Abgleich verhindert
        // Teiltreffer wie "Ei" in "Eier", daher ist eine niedrige Schwelle hier unbedenklich.
        if (core.length >= 2) keywords.add(core);
        core.split(/\s+/).forEach(word => {
          const clean = word.replace(/[^a-zA-ZäöüÄÖÜß-]/g, '');
          if (clean.length >= 4 && !INGREDIENT_STOPWORDS.has(clean.toLowerCase())) keywords.add(clean);
        });
      });
      return Array.from(keywords);
    }

    const APPLIANCE_HIGHLIGHT_SOURCE = [
      '\\d+[.,]?\\d*\\s?°C',
      '\\d+[.,]?\\d*\\s?Grad',
      'Ober-?/?Unterhitze',
      'Unterhitze',
      'Oberhitze',
      'Umluft',
      'Grillfunktion',
      'Stufe\\s?\\d+',
      '\\d+[.,]?\\d*\\s?(?:Minuten|Min\\.?|Stunden|Std\\.?|Sekunden|Sek\\.?)',
      'Backofen',
      'Herdplatte',
      'Mikrowelle',
      'Airfryer',
      'Küchenmaschine',
      'Rührgerät',
      'Wasserbad',
    ].join('|');

    function buildHighlightRegex(ingredientKeywords) {
      const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const ingredientAlts = ingredientKeywords.filter(Boolean).sort((a, b) => b.length - a.length).map(escapeRe);
      const alts = [...ingredientAlts, APPLIANCE_HIGHLIGHT_SOURCE].filter(Boolean).join('|');
      const boundary = 'a-zA-ZäöüÄÖÜß0-9';
      return new RegExp(`(?:^|[^${boundary}])(${alts})(?=[^${boundary}]|$)`, 'gi');
    }

    function renderHighlightedStep(text, ingredientKeywords) {
      const lowerKeywords = ingredientKeywords.map(k => k.toLowerCase());
      const regex = buildHighlightRegex(ingredientKeywords);
      const nodes = [];
      let lastIndex = 0;
      let match;
      let key = 0;
      while ((match = regex.exec(text)) !== null) {
        const captured = match[1];
        const capturedStart = match.index + (match[0].length - captured.length);
        const capturedEnd = capturedStart + captured.length;
        if (capturedStart > lastIndex) nodes.push(text.slice(lastIndex, capturedStart));
        const isIngredient = lowerKeywords.includes(captured.toLowerCase());
        nodes.push(
          <strong key={key++} className={isIngredient ? 'font-semibold text-emerald-700' : 'font-semibold text-indigo-700'}>{captured}</strong>
        );
        lastIndex = capturedEnd;
        if (regex.lastIndex === match.index) regex.lastIndex += 1;
      }
      if (lastIndex < text.length) nodes.push(text.slice(lastIndex));
      return nodes;
    }

    // --- GUIDED COOKING MODE: Ableitung der Teilschritte ---
    // Erkennt anhand der Ingredienz-Keywords, welche Zutaten in einem Textabschnitt vorkommen -
    // genutzt sowohl zur Fallback-Ableitung als auch potenziell zur Validierung von KI-Ergebnissen.
    function findIngredientsInText(text, ingredientKeywordMap) {
      const boundary = 'a-zA-ZäöüÄÖÜß0-9';
      const lower = text.toLowerCase();
      return ingredientKeywordMap
        .filter(({ keywords }) => keywords.some(k => {
          const escaped = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const re = new RegExp(`(?:^|[^${boundary}])${escaped}(?=[^${boundary}]|$)`, 'i');
          return re.test(lower);
        }))
        .map(({ display }) => display);
    }

    // Liefert pro Zutat neben den Such-Keywords auch einen mengenfreien Anzeigenamen (z.B. "Butter" statt
    // "150g Butter"): bei der automatischen Ableitung wissen wir nicht, wie viel von der Gesamtmenge in
    // einem einzelnen Teilschritt gebraucht wird, daher zeigen wir dort bewusst keine (potenziell falsche)
    // Mengenangabe an.
    function buildIngredientKeywordMap(ingredients) {
      return (ingredients || []).map(ing => {
        const withoutParens = ing.replace(/\([^)]*\)/g, ' ');
        const core = withoutParens.replace(INGREDIENT_LINE_STRIP, '').replace(/,.*$/, '').trim();
        return { original: ing, display: core || ing, keywords: extractIngredientKeywords([ing]) };
      });
    }

    // Erkennt eine Warte-/Kochzeit in Minuten in einem Schritt-Text (z.B. "10 Minuten", "1 Stunde").
    function detectTimerMinutes(text) {
      const match = text.match(/(\d+)\s?(Minuten|Min\.?|Stunden|Std\.?)/i);
      if (!match) return null;
      const value = parseInt(match[1], 10);
      if (!value) return null;
      return /stun|std/i.test(match[2]) ? value * 60 : value;
    }

    // Liefert die Teilschritte für den Guided Cooking Mode: nutzt recipe.guidedSteps, falls von der
    // KI mitgeliefert, sonst eine clientseitige Ableitung aus der normalen Zubereitung - damit der
    // Modus auch für ältere/manuell erfasste Rezepte ohne Datenmigration sofort funktioniert.
    function deriveGuidedSteps(recipe) {
      if (Array.isArray(recipe.guidedSteps) && recipe.guidedSteps.length > 0) {
        return recipe.guidedSteps.map(s => ({
          text: s.text || '',
          ingredients: Array.isArray(s.ingredients) ? s.ingredients : [],
          timerMinutes: typeof s.timerMinutes === 'number' && s.timerMinutes > 0 ? s.timerMinutes : detectTimerMinutes(s.text || ''),
        }));
      }
      let lines = (recipe.instructions || '').split('\n').map(l => l.trim()).filter(l => l !== '');
      // Anders als in der normalen Zubereitungsansicht wird hier IMMER versucht, mehrsätzige Zeilen
      // weiter in Einzelsätze zu zerlegen - der Guided Cooking Mode lebt von maximaler Kleinteiligkeit.
      lines = lines.flatMap(line => line.split(/(?<=[.!?])\s+(?=[A-ZÄÖÜ])/).map(s => s.trim()).filter(s => s !== ''));
      lines = lines.map(l => l.replace(/^(?:schritt\s*)?\d+[.):]\s*/i, ''));
      const keywordMap = buildIngredientKeywordMap(recipe.ingredients);
      return lines.map(text => ({
        text,
        ingredients: findIngredientsInText(text, keywordMap),
        timerMinutes: detectTimerMinutes(text),
      }));
    }

    function formatSeconds(totalSeconds) {
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    // Kurzer Piepton per Web Audio API, ohne externe Audio-Datei - läutet einen fertigen Timer ein.
    function playTimerBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch (e) { /* Web Audio evtl. nicht verfügbar - Timer bleibt trotzdem visuell erkennbar */ }
    }

    function RecipeDetail({ recipe, shoppingList = [], onBack, onAddToShoppingList, onRate, onEdit, onPersistIngredients, apiKey, model }) {
      let instructionsList = (recipe.instructions || '')
        .split('\n')
        .map(line => line.trim())
        .filter(line => line !== '');
      // Falls die Zubereitung nur ein einziger Fließtext-Block ohne Zeilenumbrüche ist (z.B. bei manuell
      // eingegebenen oder älteren KI-Rezepten), zusätzlich grob nach Satzenden trennen.
      if (instructionsList.length <= 1 && (recipe.instructions || '').length > 140) {
        instructionsList = (recipe.instructions || '').split(/(?<=[.!?])\s+(?=[A-ZÄÖÜ])/).map(s => s.trim()).filter(s => s !== '');
      }
      // Entfernt eine vom Nutzer oder der KI mitgelieferte Schrittnummer (z.B. "1.", "2)", "Schritt 3:"),
      // da die Nummer bereits als grafischer Kreis gerendert wird und sonst doppelt erscheint.
      instructionsList = instructionsList.map(line => line.replace(/^(?:schritt\s*)?\d+[.):]\s*/i, ''));
      const ingredientsList = recipe.ingredients || [];
      const ingredientKeywords = extractIngredientKeywords(ingredientsList);
      const [selectedIngredients, setSelectedIngredients] = useState([]);
      const [scaledIngredients, setScaledIngredients] = useState(null);
      const [scaleLoading, setScaleLoading] = useState(false);
      const [scaleError, setScaleError] = useState('');
      const [targetServings, setTargetServings] = useState(recipe.servings || '');
      const [isGuidedModeOpen, setIsGuidedModeOpen] = useState(false);

      const displayedIngredients = scaledIngredients || ingredientsList;
      const canUseAI = !!apiKey;

      const toggleIngredient = (ingredient) => {
        if (selectedIngredients.includes(ingredient)) setSelectedIngredients(selectedIngredients.filter(i => i !== ingredient));
        else setSelectedIngredients([...selectedIngredients, ingredient]);
      };

      const handleAddAll = () => { onAddToShoppingList(displayedIngredients); setSelectedIngredients([]); };
      const handleAddSelected = () => { onAddToShoppingList(selectedIngredients); setSelectedIngredients([]); };

      const handleScale = async (factorLabel) => {
        if (scaleLoading) return;
        setScaleLoading(true); setScaleError('');
        try {
          const result = await callGemini(apiKey, model, buildScalePrompt(displayedIngredients, factorLabel), SCALE_INGREDIENTS_SCHEMA);
          setScaledIngredients(result.ingredients || []);
          setSelectedIngredients([]);
        } catch (e) {
          setScaleError(e.message || 'Unbekannter Fehler bei der KI-Anfrage.');
        } finally {
          setScaleLoading(false);
        }
      };

      const handleScaleToServings = () => {
        if (!targetServings || !String(targetServings).trim()) return;
        handleScale(`von ${recipe.servings || 'der angegebenen Portionsmenge'} auf ${targetServings} Portionen`);
      };

      const handleResetScale = () => { setScaledIngredients(null); setScaleError(''); setSelectedIngredients([]); };
      const handleSaveScale = () => {
        if (!scaledIngredients) return;
        onPersistIngredients(recipe.id, scaledIngredients);
        setScaledIngredients(null);
      };

      return (
        <>
        <div className="max-w-4xl mx-auto pb-10">
          <div className="flex items-center justify-between mb-2">
            <button onClick={onBack} className="flex items-center gap-2 text-gray-500 hover:text-gray-900 active:text-gray-900 -m-2 p-2 rounded-lg tap-target"><IconChevronLeft /> Zurück</button>
            <button onClick={() => onEdit(recipe)} className="flex items-center gap-2 text-sm font-medium text-gray-500 hover:text-gray-900 active:text-gray-900 -m-2 p-2 rounded-lg tap-target"><IconEdit /> Bearbeiten</button>
          </div>

          <div className="bg-white rounded-2xl shadow-sm border overflow-hidden">
            <div className={`p-6 md:p-8 border-b ${getCatStyle(recipe.category).replace('text-', 'text-').replace('border-', 'border-').replace('bg-', 'bg-opacity-30 bg-')}`}>
              <div className="flex flex-wrap gap-2 mb-3">
                <span className={`inline-block text-xs font-bold uppercase px-3 py-1 rounded-full border ${getCatStyle(recipe.category)}`}>{recipe.category}</span>
                {recipe.complexity === 'quick' && <span className="inline-block text-xs font-bold uppercase px-3 py-1 rounded-full border bg-emerald-50 text-emerald-700 border-emerald-200">⚡ Quick &amp; Easy</span>}
              </div>
              <h1 className="text-2xl md:text-4xl font-bold text-gray-900 mb-3 break-words">{recipe.title}</h1>
              {recipe.time && <div className="flex items-center gap-2 text-gray-700 font-medium mb-3"><IconClock /> {recipe.time}</div>}
              <div className="flex items-center gap-1" role="group" aria-label="Rezept bewerten">
                {[1,2,3,4,5].map(n => (
                  <button
                    key={n}
                    type="button"
                    onClick={() => onRate(recipe.id, (recipe.rating || 0) === n ? 0 : n)}
                    aria-label={`${n} von 5 Sternen`}
                    aria-pressed={(recipe.rating || 0) >= n}
                    className="p-1 -m-1 rounded tap-target"
                  >
                    <IconStar size={22} filled={(recipe.rating || 0) >= n} className={(recipe.rating || 0) >= n ? 'text-amber-500' : 'text-gray-300'} />
                  </button>
                ))}
              </div>
            </div>

            <div className="px-6 md:px-8 pt-4 pb-2 border-b bg-gray-50">
              <button type="button" onClick={() => setIsGuidedModeOpen(true)} className="w-full bg-gray-900 hover:bg-black active:bg-black text-white py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 shadow-sm">
                🍳 Kochmodus starten
              </button>
            </div>

            <div className="p-6 md:p-8 flex flex-col md:flex-row gap-8">
              <div className="md:w-1/3">
                <div className="flex items-center justify-between mb-4 gap-2">
                  <h2 className="text-xl font-bold flex items-center gap-2"><IconShoppingCart/> Zutaten</h2>
                  {recipe.servings && <span className="text-xs text-gray-400 shrink-0">für {recipe.servings} Portionen</span>}
                </div>

                {canUseAI && (
                  <div className="mb-4">
                    {scaledIngredients ? (
                      <div className="p-3 bg-indigo-50 border border-indigo-100 rounded-xl mb-3">
                        <p className="text-xs font-medium text-indigo-700 mb-2">Skalierte Menge — nicht gespeichert</p>
                        <div className="flex gap-2">
                          <button type="button" onClick={handleResetScale} className="flex-1 py-2 bg-white border rounded-lg text-sm font-medium text-gray-600 active:bg-gray-100">Zurücksetzen</button>
                          <button type="button" onClick={handleSaveScale} className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 rounded-lg text-sm font-medium text-white">Im Rezept speichern</button>
                        </div>
                      </div>
                    ) : (
                      <div className="flex flex-wrap items-center gap-2">
                        <button type="button" disabled={scaleLoading} onClick={() => handleScale('um den Faktor 0,5 (halbieren)')} className="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-700 rounded-lg text-sm font-medium disabled:opacity-50">×0,5</button>
                        <button type="button" disabled={scaleLoading} onClick={() => handleScale('um den Faktor 2 (verdoppeln)')} className="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-700 rounded-lg text-sm font-medium disabled:opacity-50">×2</button>
                        <button type="button" disabled={scaleLoading} onClick={() => handleScale('um den Faktor 3 (verdreifachen)')} className="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-700 rounded-lg text-sm font-medium disabled:opacity-50">×3</button>
                        {recipe.servings && (
                          <div className="flex items-center gap-1">
                            <label htmlFor="target-servings" className="sr-only">Für wie viele Portionen</label>
                            <input id="target-servings" type="number" min="1" value={targetServings} onChange={e => setTargetServings(e.target.value)} className="w-16 p-1.5 border rounded-lg text-sm" />
                            <button type="button" disabled={scaleLoading || !targetServings} onClick={handleScaleToServings} className="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-700 rounded-lg text-sm font-medium disabled:opacity-50">Portionen</button>
                          </div>
                        )}
                        {scaleLoading && <IconSparkles size={16} className="animate-spin text-indigo-400" />}
                      </div>
                    )}
                    {scaleError && <p className="text-xs text-red-600 mt-2">{scaleError}</p>}
                  </div>
                )}

                <ul className="space-y-1 mb-6">
                  {displayedIngredients.map((ingredient, index) => {
                    const isSelected = selectedIngredients.includes(ingredient);
                    const inCart = amountInCart(shoppingList, ingredient);
                    return (
                      <li key={index}>
                        <button type="button" onClick={() => toggleIngredient(ingredient)} aria-pressed={isSelected} className={`w-full flex items-start gap-3 p-2 -mx-2 rounded-lg text-left ${isSelected ? 'bg-emerald-50' : 'hover:bg-gray-50 active:bg-gray-100'}`}>
                          <div className={`w-5 h-5 rounded border flex items-center justify-center mt-0.5 shrink-0 ${isSelected ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-gray-300'}`}>
                            {isSelected && <IconCheck />}
                          </div>
                          <span className="text-gray-700 text-sm md:text-base break-words">{ingredient}{inCart > 0 && <span className="ml-1.5 text-emerald-600 font-medium">({formatAmount(inCart, parseIngredient(ingredient).unit)})</span>}</span>
                        </button>
                      </li>
                    );
                  })}
                </ul>
                {displayedIngredients.length > 0 && (
                  <div className="flex flex-col gap-2">
                    <button onClick={handleAddAll} className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white rounded-xl flex justify-center gap-2 font-medium"><IconShoppingCart /> Alles Einkaufen</button>
                    {selectedIngredients.length > 0 && <button onClick={handleAddSelected} className="w-full py-3 bg-emerald-100 hover:bg-emerald-200 active:bg-emerald-300 text-emerald-800 rounded-xl flex justify-center gap-2 font-medium"><IconCheck /> Ausgewählte ({selectedIngredients.length})</button>}
                  </div>
                )}
              </div>

              <div className="md:w-2/3">
                <h2 className="text-xl font-bold mb-1 flex items-center gap-2"><IconUtensils/> Zubereitung</h2>
                <p className="text-xs text-gray-400 mb-4 flex flex-wrap gap-x-3 gap-y-1">
                  <span><strong className="font-semibold text-emerald-700">Zutat</strong> hervorgehoben</span>
                  <span><strong className="font-semibold text-indigo-700">Geräteeinstellung</strong> hervorgehoben</span>
                </p>
                <div className="space-y-4">
                  {instructionsList.map((step, index) => (
                    <div key={index} className="flex gap-3">
                      <div className="shrink-0 w-7 h-7 rounded-full bg-gray-100 text-gray-600 text-sm font-bold flex items-center justify-center border mt-0.5">{index + 1}</div>
                      <p className="text-gray-700 text-sm md:text-base leading-relaxed">{renderHighlightedStep(step, ingredientKeywords)}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
        {isGuidedModeOpen && <GuidedCookingView recipe={recipe} onExit={() => setIsGuidedModeOpen(false)} />}
        </>
      );
    }

    // --- GUIDED COOKING MODE ---
    // Vollbild-Karten-Ansicht, die Schritt für Schritt durchs Rezept führt: Swipe-Gesten (Pointer Events),
    // Fortschrittsbalken, kontextuelle Zutaten pro Schritt (checkbar) und ein Timer, der beim Wechseln
    // des Schritts im Hintergrund weiterläuft.
    function GuidedCookingView({ recipe, onExit }) {
      const steps = useMemo(() => deriveGuidedSteps(recipe), [recipe]);
      const ingredientKeywords = useMemo(() => extractIngredientKeywords(recipe.ingredients), [recipe]);
      const [stepIndex, setStepIndex] = useState(0);
      const [checkedIngredients, setCheckedIngredients] = useState(() => new Set());
      const [timer, setTimer] = useState({ stepIndex: null, remainingSeconds: 0, total: 0, running: false });
      const [dragX, setDragX] = useState(0);
      const [dragging, setDragging] = useState(false);
      const dragStartX = useRef(null);
      const modalRef = useRef(null);

      const step = steps[stepIndex] || { text: '', ingredients: [], timerMinutes: null };
      const isLastStep = stepIndex >= steps.length - 1;

      const goNext = () => setStepIndex(i => Math.min(i + 1, steps.length - 1));
      const goPrev = () => setStepIndex(i => Math.max(i - 1, 0));

      useEffect(() => { setDragX(0); }, [stepIndex]);

      // Fokus-Falle, Escape zum Verlassen, Pfeiltasten zum Navigieren - analog zu den bestehenden Modals.
      useEffect(() => {
        document.body.style.overflow = 'hidden';
        modalRef.current?.focus();
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') { onExit(); return; }
          if (e.key === 'ArrowRight') goNext();
          if (e.key === 'ArrowLeft') goPrev();
        };
        document.addEventListener('keydown', handleKeyDown);
        return () => {
          document.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = '';
        };
      }, [steps.length]);

      // Timer läuft unabhängig vom aktuell angezeigten Schritt weiter (z.B. Wasser kocht im Hintergrund,
      // während man schon den nächsten Schritt vorbereitet).
      useEffect(() => {
        if (!timer.running) return;
        const id = setInterval(() => {
          setTimer(t => {
            if (!t.running) return t;
            if (t.remainingSeconds <= 1) {
              playTimerBeep();
              return { ...t, remainingSeconds: 0, running: false };
            }
            return { ...t, remainingSeconds: t.remainingSeconds - 1 };
          });
        }, 1000);
        return () => clearInterval(id);
      }, [timer.running]);

      const startTimer = (idx, minutes) => setTimer({ stepIndex: idx, remainingSeconds: minutes * 60, total: minutes * 60, running: true });
      const pauseTimer = () => setTimer(t => ({ ...t, running: false }));
      const resumeTimer = () => setTimer(t => ({ ...t, running: true }));
      const resetTimer = () => setTimer({ stepIndex: null, remainingSeconds: 0, total: 0, running: false });

      const toggleIngredientChecked = (key) => {
        setCheckedIngredients(prev => {
          const next = new Set(prev);
          if (next.has(key)) next.delete(key); else next.add(key);
          return next;
        });
      };

      const handlePointerDown = (e) => {
        // Taps auf Buttons (Zutaten-Chips, Timer-Steuerung) sollen normal klicken, statt eine
        // Wisch-Geste zu starten - sonst würde der Pointer-Capture darunter ihre Klicks stören.
        if (e.target.closest('button, input, select, textarea, a')) return;
        dragStartX.current = e.clientX;
        setDragging(true);
        // Sorgt dafür, dass pointermove auch dann weiter auf diesem Element feuert, wenn der Zeiger
        // (v.a. bei Maus/Trackpad) während des Wischens dessen Grenzen verlässt.
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
      };
      const handlePointerMove = (e) => { if (dragStartX.current === null) return; setDragX(e.clientX - dragStartX.current); };
      const handlePointerUp = () => {
        if (dragStartX.current === null) return;
        if (dragX < -70) goNext();
        else if (dragX > 70) goPrev();
        setDragX(0);
        setDragging(false);
        dragStartX.current = null;
      };

      const timerIsForOtherStep = timer.stepIndex !== null && timer.stepIndex !== stepIndex && (timer.running || (!timer.running && timer.total > 0));
      const timerForThisStep = timer.stepIndex === stepIndex && timer.total > 0;
      const timerFinishedForThisStep = timerForThisStep && !timer.running && timer.remainingSeconds === 0;

      return (
        <div ref={modalRef} role="dialog" aria-modal="true" aria-label={`Kochmodus: ${recipe.title}`} tabIndex={-1} className="fixed inset-0 bg-gray-100 z-[60] flex flex-col outline-none">
          <div className="flex items-center gap-3 p-4 bg-white border-b shrink-0">
            <button type="button" onClick={onExit} aria-label="Kochmodus beenden" className="p-2 -m-2 rounded-full active:bg-gray-100 tap-target text-gray-500"><IconX /></button>
            <div className="flex-1 min-w-0">
              <div className="h-1.5 bg-gray-100 rounded-full overflow-hidden">
                <div className="h-full bg-emerald-500 rounded-full transition-all duration-300" style={{ width: `${steps.length ? ((stepIndex + 1) / steps.length) * 100 : 0}%` }} />
              </div>
              <p className="text-xs text-gray-500 mt-1">Schritt {stepIndex + 1} von {steps.length}</p>
            </div>
            {timerIsForOtherStep && (
              <button type="button" onClick={() => setStepIndex(timer.stepIndex)} className="shrink-0 flex items-center gap-1 px-2.5 py-1.5 rounded-full bg-indigo-50 text-indigo-700 text-xs font-semibold tap-target">
                <IconClock size={14} /> {timer.running ? formatSeconds(timer.remainingSeconds) : 'Fertig!'}
              </button>
            )}
          </div>

          <div className="flex-1 overflow-hidden flex p-3 md:p-6 relative">
            {steps.length === 0 ? (
              <p className="m-auto text-gray-400 text-center">Für dieses Rezept sind keine Zubereitungsschritte hinterlegt.</p>
            ) : (
              <>
                {stepIndex > 0 && <IconChevronLeft size={28} className="pointer-events-none absolute left-1 md:left-3 top-1/2 -translate-y-1/2 text-gray-200 hidden sm:block" />}
                {!isLastStep && <IconChevronLeft size={28} className="pointer-events-none absolute right-1 md:right-3 top-1/2 -translate-y-1/2 text-gray-200 rotate-180 hidden sm:block" />}
                <div
                  onPointerDown={handlePointerDown}
                  onPointerMove={handlePointerMove}
                  onPointerUp={handlePointerUp}
                  onPointerCancel={handlePointerUp}
                  style={{ touchAction: 'pan-y' }}
                  className="flex-1 flex"
                >
                  <div
                    style={{ transform: `translateX(${dragX}px) rotate(${dragX / 24}deg)`, transition: dragging ? 'none' : 'transform 0.25s ease' }}
                    className="flex-1 flex flex-col bg-white rounded-3xl shadow-lg border w-full max-w-2xl mx-auto p-6 md:p-10 select-none min-h-0"
                  >
                    <div className="flex items-center justify-between mb-2 shrink-0">
                      <div className="w-10 h-10 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center">{stepIndex + 1}</div>
                    </div>

                    {step.ingredients.length > 0 && (
                      <div className="flex flex-wrap gap-2 mb-4 shrink-0">
                        {step.ingredients.map(ing => {
                          const key = `${stepIndex}::${ing}`;
                          const checked = checkedIngredients.has(key);
                          return (
                            <button
                              key={ing}
                              type="button"
                              onClick={() => toggleIngredientChecked(key)}
                              aria-pressed={checked}
                              className={`flex items-center gap-1.5 pl-2 pr-3 py-1.5 rounded-full text-sm font-medium border tap-target ${checked ? 'bg-emerald-500 text-white border-emerald-500' : 'bg-emerald-50 text-emerald-700 border-emerald-200'}`}
                            >
                              <span className={`w-4 h-4 rounded-full border flex items-center justify-center shrink-0 ${checked ? 'bg-white border-white text-emerald-600' : 'border-emerald-400'}`}>
                                {checked && <IconCheck size={10} />}
                              </span>
                              <span className={checked ? 'line-through' : ''}>{ing}</span>
                            </button>
                          );
                        })}
                      </div>
                    )}

                    <div className="flex-1 flex items-center justify-center overflow-y-auto min-h-0 py-2">
                      <p className="text-xl md:text-3xl leading-relaxed text-gray-800 font-semibold text-center">{renderHighlightedStep(step.text, ingredientKeywords)}</p>
                    </div>

                    {step.timerMinutes ? (
                      <div className="pt-5 border-t shrink-0">
                        {timerFinishedForThisStep ? (
                          <div className="flex items-center justify-between gap-3">
                            <span className="text-indigo-700 font-semibold flex items-center gap-2"><IconClock size={18} /> Timer fertig!</span>
                            <button type="button" onClick={resetTimer} className="px-4 py-2 bg-indigo-50 text-indigo-700 rounded-lg text-sm font-medium">Zurücksetzen</button>
                          </div>
                        ) : timerForThisStep ? (
                          <div className="flex items-center justify-between gap-3">
                            <span className="text-indigo-700 font-semibold flex items-center gap-2"><IconClock size={18} /> {formatSeconds(timer.remainingSeconds)}</span>
                            <button type="button" onClick={timer.running ? pauseTimer : resumeTimer} className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium">{timer.running ? 'Pause' : 'Weiter'}</button>
                          </div>
                        ) : (
                          <div className="flex items-center justify-between gap-3">
                            <span className="text-gray-500 flex items-center gap-2"><IconClock size={18} /> {step.timerMinutes} Min</span>
                            <button type="button" onClick={() => startTimer(stepIndex, step.timerMinutes)} className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium">Timer starten</button>
                          </div>
                        )}
                      </div>
                    ) : null}
                  </div>
                </div>
              </>
            )}
          </div>
          <p className="text-center text-xs text-gray-400 pb-2 shrink-0 sm:hidden">← Wische, um zum nächsten Schritt zu wechseln →</p>

          <div className="flex items-center gap-3 p-4 bg-white border-t shrink-0">
            <button type="button" onClick={goPrev} disabled={stepIndex === 0} className="flex-1 py-3.5 rounded-xl font-bold border border-gray-200 text-gray-600 disabled:opacity-40 active:bg-gray-100">‹ Zurück</button>
            {isLastStep ? (
              <button type="button" onClick={onExit} className="flex-1 py-3.5 rounded-xl font-bold bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white">Fertig ✓</button>
            ) : (
              <button type="button" onClick={goNext} className="flex-1 py-3.5 rounded-xl font-bold bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white">Weiter ›</button>
            )}
          </div>
        </div>
      );
    }

    function WeeklyPlanView({ plan, onGenerateWeek, onDeleteWeek, recipes, onUpdateItem, onAddToShoppingList, onOpenRecipe }) {
      const [editingSlot, setEditingSlot] = useState(null);
      const [freeDraft, setFreeDraft] = useState('');

      // Wird bei jedem Aufruf/Remount (Tab-Wechsel) neu aus dem aktuellen Datum berechnet, damit sich
      // "diese" und "nächste" Woche von selbst weiterschieben, sobald eine neue Kalenderwoche beginnt.
      const weeks = useMemo(() => {
        const monday0 = getMonday(new Date());
        return [0, 1].map(w => {
          const start = addDays(monday0, w * 7);
          const dates = Array.from({ length: 7 }, (_, i) => addDays(start, i));
          return {
            key: formatISODate(start),
            label: w === 0 ? 'Diese Woche' : 'Nächste Woche',
            rangeLabel: `${formatShortDate(start)} – ${formatShortDate(dates[6])}`,
            dates,
          };
        });
      }, []);

      const handleAddWeekToShoppingList = (dateStrs) => {
        const allIngredients = [];
        dateStrs.forEach(dateStr => {
          RECIPE_CATEGORIES.forEach(cat => {
            const recipe = plan[dateStr]?.[cat];
            if (recipe && Array.isArray(recipe.ingredients)) allIngredients.push(...recipe.ingredients);
          });
        });
        if (allIngredients.length === 0) { alert('Für diese Woche sind noch keine Rezepte eingeplant.'); return; }
        onAddToShoppingList(allIngredients);
      };

      const handleDeleteWeek = (weekLabel, dateStrs) => {
        if (window.confirm(`${weekLabel} wirklich komplett löschen?`)) onDeleteWeek(dateStrs);
      };

      return (
        <div className="max-w-4xl mx-auto pb-10 space-y-8">
          {weeks.map(week => {
            const dateStrs = week.dates.map(formatISODate);
            const hasAnyRecipe = dateStrs.some(ds => plan[ds] && RECIPE_CATEGORIES.some(cat => plan[ds][cat]));
            return (
              <div key={week.key}>
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                  <div>
                    <h2 className="text-2xl md:text-3xl font-bold text-gray-900">{week.label}</h2>
                    <p className="text-sm text-gray-400">{week.rangeLabel}</p>
                  </div>
                  <div className="w-full sm:w-auto flex flex-wrap gap-2">
                    <button onClick={() => handleAddWeekToShoppingList(dateStrs)} className="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white px-4 py-2.5 rounded-xl font-medium flex items-center justify-center gap-2 shadow-sm text-sm"><IconShoppingCart size={16} /> Einkaufsliste</button>
                    <button onClick={() => onGenerateWeek(dateStrs)} className="flex-1 sm:flex-none bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white px-4 py-2.5 rounded-xl font-medium flex items-center justify-center gap-2 shadow-sm text-sm"><IconSparkles size={16} /> Füllen</button>
                    {hasAnyRecipe && (
                      <button onClick={() => handleDeleteWeek(week.label, dateStrs)} className="flex-1 sm:flex-none bg-white border border-red-200 text-red-500 px-4 py-2.5 rounded-xl font-medium flex items-center justify-center gap-2 text-sm active:bg-red-50"><IconTrash2 size={16} /> Woche löschen</button>
                    )}
                  </div>
                </div>

                <div className="space-y-4">
                  {week.dates.map(date => {
                    const dateStr = formatISODate(date);
                    const dayLabel = DAY_LABELS_SHORT[date.getDay() === 0 ? 6 : date.getDay() - 1];
                    return (
                      <div key={dateStr} className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                        <div className="bg-gray-50 px-4 py-2 border-b font-bold text-gray-700">
                          {dayLabel} <span className="text-gray-400 font-normal">{formatShortDate(date)}</span>
                        </div>
                        <div className="p-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
                          {RECIPE_CATEGORIES.map(cat => {
                            const isEditing = editingSlot?.dateStr === dateStr && editingSlot?.category === cat;
                            const currentRecipe = plan[dateStr]?.[cat];
                            const availableRecipes = recipes.filter(r => r.category === cat);

                            return (
                              <div key={cat} className="flex flex-col relative">
                                <span className="text-[10px] md:text-xs text-gray-400 font-semibold uppercase mb-1">{cat}</span>
                                {isEditing ? (
                                  <div className="border rounded-lg bg-white p-2 space-y-2">
                                    {editingSlot.mode === 'text' ? (
                                      <form className="flex gap-2" onSubmit={(e) => { e.preventDefault(); onUpdateItem(dateStr, cat, { freeText: freeDraft }); setEditingSlot(null); }}>
                                        <input autoFocus value={freeDraft} onChange={(e) => setFreeDraft(e.target.value)} placeholder="z.B. Essen gehen" className="flex-1 min-w-0 p-2 text-sm border rounded-lg min-h-[44px]" />
                                        <button type="submit" aria-label="Speichern" className="px-3 rounded-lg bg-emerald-600 text-white min-h-[44px]"><IconCheck size={16} /></button>
                                      </form>
                                    ) : (
                                      <>
                                        <button type="button" onClick={() => { onUpdateItem(dateStr, cat, ''); setEditingSlot(null); }} className="w-full min-h-[40px] text-left px-2 text-sm text-gray-500 italic rounded-lg hover:bg-gray-50 active:bg-gray-100">Frei</button>
                                        <button type="button" onClick={() => { setFreeDraft(''); setEditingSlot({ dateStr, category: cat, mode: 'text' }); }} className="w-full min-h-[40px] text-left px-2 text-sm font-medium text-indigo-600 rounded-lg hover:bg-indigo-50 active:bg-indigo-100">Freitext …</button>
                                        {availableRecipes.map(r => (
                                          <button key={r.id} type="button" onClick={() => { onUpdateItem(dateStr, cat, r.id); setEditingSlot(null); }} className={`w-full min-h-[40px] text-left px-2 text-sm rounded-lg hover:bg-gray-50 active:bg-gray-100 ${currentRecipe && currentRecipe.id === r.id ? 'font-bold' : ''}`}>{r.title}</button>
                                        ))}
                                      </>
                                    )}
                                    <button type="button" onClick={() => setEditingSlot(null)} className="w-full min-h-[36px] text-xs text-gray-400 rounded-lg active:bg-gray-100">Abbrechen</button>
                                  </div>
                                ) : currentRecipe && !currentRecipe.isFree ? (
                                  <div className="flex gap-1">
                                    <button
                                      type="button"
                                      onClick={() => onOpenRecipe(currentRecipe)}
                                      aria-label={`${currentRecipe.title} öffnen`}
                                      className={`flex-1 min-w-0 min-h-[44px] flex items-center text-left p-2 rounded-lg text-sm border font-medium truncate active:bg-gray-100 ${getCatStyle(cat)}`}
                                    >
                                      <span className="truncate">{currentRecipe.title}</span>
                                    </button>
                                    <button
                                      type="button"
                                      onClick={() => setEditingSlot({ dateStr, category: cat, mode: 'pick' })}
                                      aria-label={`${cat} am ${dayLabel} ${formatShortDate(date)} ändern`}
                                      className="shrink-0 w-11 min-h-[44px] flex items-center justify-center rounded-lg border text-gray-500 bg-white active:bg-gray-100"
                                    ><IconEdit /></button>
                                  </div>
                                ) : (
                                  <button
                                    type="button"
                                    onClick={() => {
                                      if (currentRecipe) setFreeDraft(currentRecipe.title);
                                      setEditingSlot({ dateStr, category: cat, mode: currentRecipe ? 'text' : 'pick' });
                                    }}
                                    aria-label={`${cat} am ${dayLabel} ${formatShortDate(date)} bearbeiten${currentRecipe ? `, aktuell ${currentRecipe.title}` : ', aktuell frei'}`}
                                    className={`w-full min-h-[44px] flex items-center text-left p-2 rounded-lg text-sm border truncate active:bg-gray-100 ${currentRecipe ? `${getCatStyle(cat)} italic` : 'border-dashed text-gray-400 italic'}`}
                                  >
                                    {currentRecipe ? currentRecipe.title : 'Frei'}
                                  </button>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function ShoppingListView({ items, categoryOrder, onToggle, onRemove, onClear, onChangeCategory, onMoveCategory, onAddManualItem }) {
      const [manualInput, setManualInput] = useState('');
      const [isListening, setIsListening] = useState(false);
      const recognitionRef = useRef(null);

      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          recognitionRef.current = new SpeechRecognition();
          recognitionRef.current.lang = 'de-DE';

    // --- CONSTANTS & INITIAL DATA ---
    const DAYS = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];

    // --- LOCAL STORAGE HELPERS ---
    const loadData = (key, defaultData) => {

    // --- GEMINI AI HELPERS ---
    const GEMINI_MODELS = [
      { id: 'gemini-2.5-flash-lite', label: 'Flash-Lite (am günstigsten)' },
      { id: 'gemini-2.5-flash', label: 'Flash (empfohlen)' },
      { id: 'gemini-2.5-pro', label: 'Pro (beste Qualität, teurer)' },
    ];

    const RECIPE_SCHEMA = {
      type: 'OBJECT',
      properties: {
        title: { type: 'STRING' },
        category: { type: 'STRING', enum: RECIPE_CATEGORIES },
        time: { type: 'STRING' },
        ingredients: { type: 'ARRAY', items: { type: 'STRING' } },
        instructions: { type: 'STRING' },
      },
      required: ['title', 'category', 'ingredients', 'instructions'],
    };

      type: 'OBJECT',
      properties: { category: { type: 'STRING', enum: DEFAULT_SHOPPING_CATEGORIES } },
      required: ['category'],

    const SCALE_INGREDIENTS_SCHEMA = {
      type: 'OBJECT',
      properties: { ingredients: { type: 'ARRAY', items: { type: 'STRING' } } },
      required: ['ingredients'],
    };

    // Diese Statuscodes bedeuten meist eine kurzzeitige Überlastung bei Google (z.B. "high demand")
    // und lohnen sich für einen automatischen Retry mit Backoff, statt sofort aufzugeben.
    const GEMINI_RETRYABLE_STATUS = [429, 500, 503];

    async function callGemini(apiKey, model, prompt, schema, imagePart, attempt = 0) {
      if (!apiKey) throw new Error('Kein Gemini API-Key hinterlegt.');
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);
      let res;
      try {
        res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ role: 'user', parts: imagePart ? [imagePart, { text: prompt }] : [{ text: prompt }] }],
            generationConfig: { responseMimeType: 'application/json', responseSchema: schema },
          }),
          signal: controller.signal,
        });
      } catch (e) {
        clearTimeout(timeoutId);
        if (e.name === 'AbortError') throw new Error('Zeitüberschreitung: Gemini hat nicht rechtzeitig geantwortet.');
        throw new Error('Gemini konnte nicht erreicht werden (Netzwerkfehler).');
      }
      clearTimeout(timeoutId);
      if (!res.ok) {
        if (GEMINI_RETRYABLE_STATUS.includes(res.status) && attempt < 2) {
          await new Promise(r => setTimeout(r, 1000 * Math.pow(2, attempt))); // 1s, dann 2s
          return callGemini(apiKey, model, prompt, schema, imagePart, attempt + 1);
        }
        let detail = '';
        try { const errJson = await res.json(); detail = errJson?.error?.message || ''; } catch (e) {}
        const readable = res.status === 503 ? 'Gemini ist gerade überlastet. Bitte in Kürze erneut versuchen.' : (detail || `Gemini-Anfrage fehlgeschlagen (${res.status})`);
        throw new Error(readable);
      }
      const data = await res.json();
      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error('Gemini hat keine Antwort geliefert.');
      return JSON.parse(text);
    }

    // Liest eine Bilddatei als Base64 und baut den inlineData-Part fürs Gemini-Vision-Input.
    // Ungetestet gegen die echte API (Google-Domains in dieser Dev-Sandbox blockiert): Gemini nutzt
    // sonst durchgängig camelCase (generationConfig, responseMimeType) - falls ein 400er kommt, hier
    // testweise auf snake_case (inline_data / mime_type) umstellen.
    const fileToImagePart = (file) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = String(reader.result).split(',')[1];
        resolve({ inlineData: { mimeType: file.type || 'image/jpeg', data: base64 } });
      };
      reader.onerror = () => reject(new Error('Bild konnte nicht gelesen werden.'));
      reader.readAsDataURL(file);
    });

    const buildRecipePrompt = (dishName) => `Erstelle ein Kochrezept für "${dishName}" auf Deutsch. Gib realistische Mengenangaben bei den Zutaten an (z.B. "200g Mehl"). Trenne die Zubereitungsschritte durch Zeilenumbrüche, ohne sie selbst zu nummerieren. Die Kategorie muss exakt einer dieser Werte sein: ${RECIPE_CATEGORIES.join(', ')}.`;

    const buildImprovePrompt = (recipe) => `Verbessere folgendes Rezept: mache Zutatenmengen realistischer, die Zubereitung klarer und behebe Ungereimtheiten. Antworte auf Deutsch.\nTitel: ${recipe.title}\nKategorie: ${recipe.category}\nZeit: ${recipe.time || ''}\nZutaten:\n${(recipe.ingredients || []).join('\n')}\nZubereitung:\n${recipe.instructions || ''}\nDie Kategorie muss exakt einer dieser Werte sein: ${RECIPE_CATEGORIES.join(', ')}.`;

    const buildCategoryPrompt = (ingredientText) => `Ordne die Einkaufsliste-Zutat "${ingredientText}" genau einer dieser Kategorien zu: ${DEFAULT_SHOPPING_CATEGORIES.join(', ')}. Antworte ausschließlich mit der Kategorie.`;

    const buildPasteExtractPrompt = (pasteText) => `Extrahiere ein Kochrezept aus folgendem eingefügten Text (z.B. von einer Kochseite oder aus einem Kochbuch kopiert). Antworte auf Deutsch. Gib realistische Mengenangaben bei den Zutaten an. Trenne die Zubereitungsschritte durch Zeilenumbrüche, ohne sie selbst zu nummerieren. Die Kategorie muss exakt einer dieser Werte sein: ${RECIPE_CATEGORIES.join(', ')}.\n\nText:\n${pasteText}`;

    const buildPhotoExtractPrompt = () => `Auf diesem Bild ist ein Kochrezept (z.B. aus einem Kochbuch oder handschriftlich). Extrahiere Titel, Zutaten und Zubereitung. Antworte auf Deutsch. Gib realistische Mengenangaben bei den Zutaten an. Trenne die Zubereitungsschritte durch Zeilenumbrüche, ohne sie selbst zu nummerieren. Die Kategorie muss exakt einer dieser Werte sein: ${RECIPE_CATEGORIES.join(', ')}.`;

    const buildScalePrompt = (ingredients, factorLabel) => `Skaliere die folgende Zutatenliste eines Rezepts ${factorLabel}. Runde auf realistische, küchentaugliche Mengen (z.B. "1,5 EL" statt krummer Dezimalzahlen). Behalte Reihenfolge und Wortlaut so weit wie möglich bei, ändere nur die Mengenangaben. Antworte auf Deutsch.\nZutaten:\n${ingredients.join('\n')}`;

    function App() {
      // States initializing from LocalStorage
      const [recipes, setRecipes] = useState(() =>
        loadData('rm_recipes', []).filter(r => LEGACY_SEED_TITLES[r.id] !== r.title)
      );
      const [shoppingList, setShoppingList] = useState(() => loadData('rm_shoppingList', []));
      const [categoryOrder, setCategoryOrder] = useState(() => loadData('rm_categoryOrder', DEFAULT_SHOPPING_CATEGORIES));
      const [learnedCategories, setLearnedCategories] = useState(() => loadData('rm_learnedCategories', {}));
      const [weeklyPlan, setWeeklyPlan] = useState(() => loadData('rm_weeklyPlan', DAYS.reduce((acc, day) => ({ ...acc, [day]: { Frühstück: null, Snack: null, Hauptspeise: null } }), {})));
      const [geminiApiKey, setGeminiApiKey] = useState(() => loadData('rm_geminiApiKey', ''));
      const [geminiModel, setGeminiModel] = useState(() => loadData('rm_geminiModel', GEMINI_MODELS[1].id));

      const [activeTab, setActiveTab] = useState('recipes');
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [editingRecipe, setEditingRecipe] = useState(null);
      const [isAiSettingsOpen, setIsAiSettingsOpen] = useState(false);
      const [selectedRecipe, setSelectedRecipe] = useState(null);

      const activeRecipe = selectedRecipe ? (recipes.find(r => r.id === selectedRecipe.id) || null) : null;

      // Save to LocalStorage on change
      useEffect(() => { saveData('rm_recipes', recipes); }, [recipes]);
      useEffect(() => { saveData('rm_shoppingList', shoppingList); }, [shoppingList]);
      useEffect(() => { saveData('rm_categoryOrder', categoryOrder); }, [categoryOrder]);
      useEffect(() => { saveData('rm_learnedCategories', learnedCategories); }, [learnedCategories]);
      useEffect(() => { saveData('rm_weeklyPlan', weeklyPlan); }, [weeklyPlan]);
      useEffect(() => { saveData('rm_geminiApiKey', geminiApiKey); }, [geminiApiKey]);
      useEffect(() => { saveData('rm_geminiModel', geminiModel); }, [geminiModel]);

      const guessCategory = (ingredientText) => {
        if (learnedCategories[ingredientText]) return learnedCategories[ingredientText];
        const lowerText = ingredientText.toLowerCase();
        for (const [keyword, category] of Object.entries(SMART_KEYWORDS)) {
          const wordBoundary = new RegExp(`(^|[^a-zäöüß])${keyword}([^a-zäöüß]|$)`, 'i');
          if (wordBoundary.test(lowerText)) return category;
        }
        return 'Sonstiges';
      };

      const saveRecipe = (recipeData) => {
        if (recipeData.id) {
          setRecipes(prev => prev.map(r => r.id === recipeData.id ? { ...r, ...recipeData } : r));
        } else {
          setRecipes(prev => [{ ...recipeData, id: Date.now().toString(), rating: 0 }, ...prev]);
        }
        setIsAddModalOpen(false);
        setEditingRecipe(null);
      };

      const openAddRecipeModal = () => { setEditingRecipe(null); setIsAddModalOpen(true); };
      const openEditRecipeModal = (recipe) => { setEditingRecipe(recipe); setIsAddModalOpen(true); };
      const closeRecipeModal = () => { setIsAddModalOpen(false); setEditingRecipe(null); };

      const rateRecipe = (id, rating) => {
        setRecipes(prev => prev.map(r => r.id === id ? { ...r, rating } : r));
      };

      const persistScaledIngredients = (id, newIngredients) => {
        setRecipes(prev => prev.map(r => r.id === id ? { ...r, ingredients: newIngredients } : r));
      };

      const deleteRecipe = (id) => {
        setRecipes(prev => prev.filter(r => r.id !== id));
        if (selectedRecipe && selectedRecipe.id === id) setSelectedRecipe(null);
      };

      // Fragt Gemini im Hintergrund nach einer Kategorie für Zutaten, die der lokale Keyword-Abgleich nicht kennt
      const classifyUnknownItemsWithAI = (itemsToClassify) => {
        if (!geminiApiKey) return;
        itemsToClassify.forEach(({ id, text }) => {
          callGemini(geminiApiKey, geminiModel, buildCategoryPrompt(text), CATEGORY_SCHEMA)
            .then(result => {
              const category = result?.category;
              if (category && DEFAULT_SHOPPING_CATEGORIES.includes(category)) {
                setShoppingList(prev => prev.map(item => item.id === id ? { ...item, category } : item));
                setLearnedCategories(prev => ({ ...prev, [text]: category }));
              }
            })
            .catch(() => { /* Hintergrund-Anreicherung: bei Fehler bleibt die lokale Einordnung bestehen */ });
        });
      };

      const addToShoppingList = (ingredients) => {
        if (!ingredients || !Array.isArray(ingredients) || ingredients.length === 0) return;
        const newItems = ingredients.map(item => ({
          id: Date.now() + Math.random(), text: item, checked: false, category: guessCategory(item)
        }));
        setShoppingList(prev => [...prev, ...newItems]);
        classifyUnknownItemsWithAI(newItems.filter(i => i.category === 'Sonstiges'));
      };

      const addManualShoppingItem = (text) => {
        if (!text || !text.trim()) return;
        const itemsTextArray = text.replace(/\s+und\s+/gi, ',').split(',').map(item => item.trim()).filter(item => item.length > 0);
        const newItems = itemsTextArray.map(itemText => ({
          id: Date.now() + Math.random(), text: itemText, checked: false, category: guessCategory(itemText)
        }));
        setShoppingList(prev => [...prev, ...newItems]);
        classifyUnknownItemsWithAI(newItems.filter(i => i.category === 'Sonstiges'));
      };

      const toggleShoppingItem = (id) => setShoppingList(prev => prev.map(item => item.id === id ? { ...item, checked: !item.checked } : item));
      const removeShoppingItem = (id) => setShoppingList(prev => prev.filter(item => item.id !== id));

      const changeItemCategory = (id, newCategory, itemText) => {
        setShoppingList(prev => prev.map(item => item.id === id ? { ...item, category: newCategory } : item));
        setLearnedCategories(prev => ({ ...prev, [itemText]: newCategory }));
      };

      const moveCategory = (cat, direction) => {
        setCategoryOrder(prev => {
          const idx = prev.indexOf(cat);
          const newIdx = idx + direction;
          if (idx === -1 || newIdx < 0 || newIdx >= prev.length) return prev;
          const newOrder = [...prev];
          [newOrder[idx], newOrder[newIdx]] = [newOrder[newIdx], newOrder[idx]];
          return newOrder;
        });
      };

      const generateWeeklyPlan = () => {
        const newPlan = {};
        DAYS.forEach(day => {
          newPlan[day] = {};
          RECIPE_CATEGORIES.forEach(cat => {
            const catRecipes = recipes.filter(r => r.category === cat);
            if (catRecipes.length > 0) {
              const randomRecipe = catRecipes[Math.floor(Math.random() * catRecipes.length)];
              newPlan[day][cat] = randomRecipe;
            } else { newPlan[day][cat] = null; }
          });
        });
        setWeeklyPlan(newPlan);
      };

      const updateWeeklyPlanItem = (day, category, recipeId) => {
        const recipe = recipeId ? recipes.find(r => r.id === recipeId) : null;
        setWeeklyPlan(prev => ({ ...prev, [day]: { ...prev[day], [category]: recipe } }));
      };

      // Bottom Navigation for Mobile
      const NavItemMobile = ({ active, onClick, icon, label, badge }) => (
        <button onClick={onClick} className={`flex flex-col items-center justify-center w-full py-2 ${active ? 'text-emerald-600' : 'text-gray-500'}`}>
          <div className="relative">
            {icon}
            {badge > 0 && <span className="absolute -top-2 -right-3 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">{badge}</span>}
          </div>
          <span className="text-[10px] mt-1 font-medium">{label}</span>
        </button>
      );

      return (
        <div className="min-h-screen bg-gray-50 flex flex-col md:flex-row text-gray-800 pb-24 md:pb-0">

          {/* Desktop Sidebar */}
          <nav className="hidden md:flex w-64 bg-white border-r border-gray-200 p-4 flex-col justify-start shadow-sm z-10 sticky top-0 h-screen shrink-0">
            <div className="flex items-center gap-2 mb-8 text-emerald-600">
              <IconUtensils size={28} />
              <h1 className="text-xl font-bold">Rezept Meister</h1>
            </div>
            <div className="flex flex-col gap-2 w-full">
              <button onClick={() => { setActiveTab('recipes'); setSelectedRecipe(null); }} className={`flex items-center gap-3 p-3 rounded-xl ${activeTab === 'recipes' ? 'bg-emerald-50 text-emerald-700 font-semibold' : 'text-gray-500 hover:bg-gray-100'}`}><IconBook/> Rezepte</button>
              <button onClick={() => { setActiveTab('plan'); setSelectedRecipe(null); }} className={`flex items-center gap-3 p-3 rounded-xl ${activeTab === 'plan' ? 'bg-emerald-50 text-emerald-700 font-semibold' : 'text-gray-500 hover:bg-gray-100'}`}><IconCalendar/> Wochenplan</button>
              <button onClick={() => { setActiveTab('shopping'); setSelectedRecipe(null); }} className={`flex items-center gap-3 p-3 rounded-xl ${activeTab === 'shopping' ? 'bg-emerald-50 text-emerald-700 font-semibold' : 'text-gray-500 hover:bg-gray-100'}`}>
            <IconShoppingCart/> Einkaufsliste
            {shoppingList.filter(i => !i.checked).length > 0 && <span className="ml-auto bg-emerald-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">{shoppingList.filter(i => !i.checked).length}</span>}
          </button>
              <button onClick={() => setIsAiSettingsOpen(true)} className="flex items-center gap-3 p-3 rounded-xl text-gray-500 hover:bg-gray-100">
                <IconSettings/> KI-Einstellungen
              </button>
        </div>
      </nav>

      {/* Mobile Header */}
      <header className="md:hidden bg-white p-4 shadow-sm flex items-center justify-between text-emerald-600 font-bold text-lg sticky top-0 z-10">
        <div className="flex items-center">
          <IconUtensils size={20} className="mr-2" /> Rezept Meister
        </div>
        <div className="flex items-center gap-1">
          <button onClick={() => setIsAiSettingsOpen(true)} aria-label="KI-Einstellungen" className="p-2 -m-1 rounded-full active:bg-gray-100 tap-target text-gray-400">
            <IconSettings size={20} />
          </button>
        </div>
      </header>

      <main className="flex-1 p-4 md:p-8 overflow-y-auto">
            {activeTab === 'recipes' && !activeRecipe && <RecipesOverview recipes={recipes} onAddClick={openAddRecipeModal} onDelete={deleteRecipe} onSelectRecipe={setSelectedRecipe} />}
            {activeTab === 'recipes' && activeRecipe && <RecipeDetail recipe={activeRecipe} onBack={() => setSelectedRecipe(null)} onAddToShoppingList={addToShoppingList} onRate={rateRecipe} onEdit={openEditRecipeModal} onPersistIngredients={persistScaledIngredients} apiKey={geminiApiKey} model={geminiModel} />}
            {activeTab === 'plan' && <WeeklyPlanView plan={weeklyPlan} onGenerate={generateWeeklyPlan} recipes={recipes} onUpdateItem={updateWeeklyPlanItem} />}
            {activeTab === 'shopping' && <ShoppingListView items={shoppingList} categoryOrder={categoryOrder} onToggle={toggleShoppingItem} onRemove={removeShoppingItem} onClear={() => setShoppingList([])} onChangeCategory={changeItemCategory} onMoveCategory={moveCategory} onAddManualItem={addManualShoppingItem} />}
          </main>

          {/* Mobile Bottom Navigation */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around pb-safe z-50">
            <NavItemMobile active={activeTab === 'recipes'} onClick={() => { setActiveTab('recipes'); setSelectedRecipe(null); }} icon={<IconBook/>} label="Rezepte" />
            <NavItemMobile active={activeTab === 'plan'} onClick={() => { setActiveTab('plan'); setSelectedRecipe(null); }} icon={<IconCalendar/>} label="Plan" />
            <NavItemMobile active={activeTab === 'shopping'} onClick={() => { setActiveTab('shopping'); setSelectedRecipe(null); }} icon={<IconShoppingCart/>} label="Einkaufen" badge={shoppingList.filter(i => !i.checked).length} />
          </nav>

          {isAddModalOpen && <AddRecipeModal onClose={closeRecipeModal} onSave={saveRecipe} apiKey={geminiApiKey} model={geminiModel} initialRecipe={editingRecipe} />}
          {isAiSettingsOpen && <AiSettingsModal apiKey={geminiApiKey} model={geminiModel} onSave={(key, model) => { setGeminiApiKey(key); setGeminiModel(model); }} onClose={() => setIsAiSettingsOpen(false)} />}
        </div>
      );
    }

    // --- SUBCOMPONENTS ---

    function RecipesOverview({ recipes, onAddClick, onDelete, onSelectRecipe }) {
      const [filter, setFilter] = useState('Alle');
      const [search, setSearch] = useState('');

      const filteredRecipes = useMemo(() => {
        return recipes.filter(r => {
          const matchesFilter = filter === 'Alle' || r.category === filter;
          const matchesSearch = (r.title || '').toLowerCase().includes(search.toLowerCase());
          return matchesFilter && matchesSearch;
        });
      }, [recipes, filter, search]);

      return (
        <div className="max-w-6xl mx-auto flex flex-col h-full animate-in fade-in duration-300">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
            <div><h2 className="text-2xl md:text-3xl font-bold text-gray-900">Meine Rezepte</h2></div>
            <button onClick={onAddClick} className="w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white px-5 py-3 rounded-xl font-medium flex items-center justify-center gap-2 shadow-lg"><IconPlus /> Neues Rezept</button>
          </div>

          <div className="flex flex-col sm:flex-row gap-4 mb-6 justify-between">
            <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
              {['Alle', 'Frühstück', 'Snack', 'Hauptspeise'].map(cat => (
                <button key={cat} onClick={() => setFilter(cat)} className={`px-4 py-2 rounded-full whitespace-nowrap text-sm font-medium border ${filter === cat ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-600 active:bg-gray-100'}`}>{cat}</button>
              ))}
            </div>
            <div className="relative w-full sm:w-64">
              <label htmlFor="recipe-search" className="sr-only">Rezepte durchsuchen</label>
              <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><IconSearch /></span>
              <input id="recipe-search" type="text" placeholder="Suchen..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full pl-10 pr-4 py-2.5 rounded-xl border focus:ring-2 focus:ring-emerald-500" />
            </div>
          </div>

          {filteredRecipes.length === 0 ? (
            <div className="flex-1 flex flex-col items-center justify-center text-gray-400 py-12"><IconUtensils size={64} /><p className="mt-4">Keine Rezepte gefunden.</p></div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 pb-10">
              {filteredRecipes.map(recipe => (
                <div key={recipe.id} className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 hover:shadow-md active:shadow-sm cursor-pointer flex flex-col h-full" onClick={() => onSelectRecipe(recipe)}>
                  <div className="flex justify-between items-start mb-3">
                    <span className={`text-xs font-bold uppercase px-2 py-1 rounded-md border ${getCatStyle(recipe.category)}`}>{recipe.category}</span>
                    <button onClick={(e) => { e.stopPropagation(); onDelete(recipe.id); }} aria-label={`${recipe.title} löschen`} className="text-gray-300 hover:text-red-500 active:text-red-600 p-2.5 -m-2 rounded-full tap-target"><IconTrash2 /></button>
                  </div>
                  <h3 className="text-lg md:text-xl font-bold text-gray-900 mb-2 line-clamp-2 break-words">{recipe.title}</h3>
                  <div className="flex items-center gap-3 mb-4">
                    {recipe.time && <div className="flex items-center gap-1 text-sm text-gray-500"><IconClock /> {recipe.time}</div>}
                    {recipe.rating > 0 && (
                      <div className="flex items-center gap-0.5 text-amber-400">
                        {[1,2,3,4,5].map(n => <IconStar key={n} size={13} filled={recipe.rating >= n} />)}
                      </div>
                    )}
                  </div>
                  <div className="mt-auto pt-4 border-t border-gray-100"><p className="text-sm text-gray-500 line-clamp-2"><span className="font-semibold">Zutaten:</span> {(recipe.ingredients || []).join(', ')}</p></div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function RecipeDetail({ recipe, onBack, onAddToShoppingList, onRate, onEdit, onPersistIngredients, apiKey, model }) {
      const instructionsList = (recipe.instructions || '').split('\n').filter(line => line.trim() !== '');
      const ingredientsList = recipe.ingredients || [];
      const [selectedIngredients, setSelectedIngredients] = useState([]);
      const [scaledIngredients, setScaledIngredients] = useState(null);
      const [scaleLoading, setScaleLoading] = useState(false);
      const [scaleError, setScaleError] = useState('');
      const [targetServings, setTargetServings] = useState(recipe.servings || '');

      const displayedIngredients = scaledIngredients || ingredientsList;
      const canUseAI = !!apiKey;

      const toggleIngredient = (ingredient) => {
        if (selectedIngredients.includes(ingredient)) setSelectedIngredients(selectedIngredients.filter(i => i !== ingredient));
        else setSelectedIngredients([...selectedIngredients, ingredient]);
      };

      const handleAddAll = () => { onAddToShoppingList(displayedIngredients); setSelectedIngredients([]); };
      const handleAddSelected = () => { onAddToShoppingList(selectedIngredients); setSelectedIngredients([]); };

      const handleScale = async (factorLabel) => {
        if (scaleLoading) return;
        setScaleLoading(true); setScaleError('');
        try {
          const result = await callGemini(apiKey, model, buildScalePrompt(displayedIngredients, factorLabel), SCALE_INGREDIENTS_SCHEMA);
          setScaledIngredients(result.ingredients || []);
          setSelectedIngredients([]);
        } catch (e) {
          setScaleError(e.message || 'Unbekannter Fehler bei der KI-Anfrage.');
        } finally {
          setScaleLoading(false);
        }
      };

      const handleScaleToServings = () => {
        if (!targetServings || !String(targetServings).trim()) return;
        handleScale(`von ${recipe.servings || 'der angegebenen Portionsmenge'} auf ${targetServings} Portionen`);
      };

      const handleResetScale = () => { setScaledIngredients(null); setScaleError(''); setSelectedIngredients([]); };
      const handleSaveScale = () => {
        if (!scaledIngredients) return;
        onPersistIngredients(recipe.id, scaledIngredients);
        setScaledIngredients(null);
      };

      return (
        <div className="max-w-4xl mx-auto pb-10">
          <div className="flex items-center justify-between mb-2">
            <button onClick={onBack} className="flex items-center gap-2 text-gray-500 hover:text-gray-900 active:text-gray-900 -m-2 p-2 rounded-lg tap-target"><IconChevronLeft /> Zurück</button>
            <button onClick={() => onEdit(recipe)} className="flex items-center gap-2 text-sm font-medium text-gray-500 hover:text-gray-900 active:text-gray-900 -m-2 p-2 rounded-lg tap-target"><IconEdit /> Bearbeiten</button>
          </div>

          <div className="bg-white rounded-2xl shadow-sm border overflow-hidden">
            <div className={`p-6 md:p-8 border-b ${getCatStyle(recipe.category).replace('text-', 'text-').replace('border-', 'border-').replace('bg-', 'bg-opacity-30 bg-')}`}>
              <span className={`inline-block text-xs font-bold uppercase px-3 py-1 rounded-full border mb-3 ${getCatStyle(recipe.category)}`}>{recipe.category}</span>
              <h1 className="text-2xl md:text-4xl font-bold text-gray-900 mb-3 break-words">{recipe.title}</h1>
              {recipe.time && <div className="flex items-center gap-2 text-gray-700 font-medium mb-3"><IconClock /> {recipe.time}</div>}
              <div className="flex items-center gap-1" role="group" aria-label="Rezept bewerten">
                {[1,2,3,4,5].map(n => (
                  <button
                    key={n}
                    type="button"
                    onClick={() => onRate(recipe.id, (recipe.rating || 0) === n ? 0 : n)}
                    aria-label={`${n} von 5 Sternen`}
                    aria-pressed={(recipe.rating || 0) >= n}
                    className="p-1 -m-1 rounded tap-target"
                  >
                    <IconStar size={22} filled={(recipe.rating || 0) >= n} className={(recipe.rating || 0) >= n ? 'text-amber-500' : 'text-gray-300'} />
                  </button>
                ))}
              </div>
            </div>

            <div className="p-6 md:p-8 flex flex-col md:flex-row gap-8">
              <div className="md:w-1/3">
                <div className="flex items-center justify-between mb-4 gap-2">
                  <h2 className="text-xl font-bold flex items-center gap-2"><IconShoppingCart/> Zutaten</h2>
                  {recipe.servings && <span className="text-xs text-gray-400 shrink-0">für {recipe.servings} Portionen</span>}
                </div>

                {canUseAI && (
                  <div className="mb-4">
                    {scaledIngredients ? (
                      <div className="p-3 bg-indigo-50 border border-indigo-100 rounded-xl mb-3">
                        <p className="text-xs font-medium text-indigo-700 mb-2">Skalierte Menge — nicht gespeichert</p>
                        <div className="flex gap-2">
                          <button type="button" onClick={handleResetScale} className="flex-1 py-2 bg-white border rounded-lg text-sm font-medium text-gray-600 active:bg-gray-100">Zurücksetzen</button>
                          <button type="button" onClick={handleSaveScale} className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 rounded-lg text-sm font-medium text-white">Im Rezept speichern</button>
                        </div>
                      </div>
                    ) : (
                      <div className="flex flex-wrap items-center gap-2">
                        <button type="button" disabled={scaleLoading} onClick={() => handleScale('um den Faktor 0,5 (halbieren)')} className="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-700 rounded-lg text-sm font-medium disabled:opacity-50">×0,5</button>
                        <button type="button" disabled={scaleLoading} onClick={() => handleScale('um den Faktor 2 (verdoppeln)')} className="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-700 rounded-lg text-sm font-medium disabled:opacity-50">×2</button>
                        <button type="button" disabled={scaleLoading} onClick={() => handleScale('um den Faktor 3 (verdreifachen)')} className="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-700 rounded-lg text-sm font-medium disabled:opacity-50">×3</button>
                        {recipe.servings && (
                          <div className="flex items-center gap-1">
                            <label htmlFor="target-servings" className="sr-only">Für wie viele Portionen</label>
                            <input id="target-servings" type="number" min="1" value={targetServings} onChange={e => setTargetServings(e.target.value)} className="w-16 p-1.5 border rounded-lg text-sm" />
                            <button type="button" disabled={scaleLoading || !targetServings} onClick={handleScaleToServings} className="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-700 rounded-lg text-sm font-medium disabled:opacity-50">Portionen</button>
                          </div>
                        )}
                        {scaleLoading && <IconSparkles size={16} className="animate-spin text-indigo-400" />}
                      </div>
                    )}
                    {scaleError && <p className="text-xs text-red-600 mt-2">{scaleError}</p>}
                  </div>
                )}

                <ul className="space-y-1 mb-6">
                  {displayedIngredients.map((ingredient, index) => {
                    const isSelected = selectedIngredients.includes(ingredient);
                    return (
                      <li key={index}>
                        <button type="button" onClick={() => toggleIngredient(ingredient)} aria-pressed={isSelected} className={`w-full flex items-start gap-3 p-2 -mx-2 rounded-lg text-left ${isSelected ? 'bg-emerald-50' : 'hover:bg-gray-50 active:bg-gray-100'}`}>
                          <div className={`w-5 h-5 rounded border flex items-center justify-center mt-0.5 shrink-0 ${isSelected ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-gray-300'}`}>
                            {isSelected && <IconCheck />}
                          </div>
                          <span className="text-gray-700 text-sm md:text-base break-words">{ingredient}</span>
                        </button>
                      </li>
                    );
                  })}
                </ul>
                {displayedIngredients.length > 0 && (
                  <div className="flex flex-col gap-2">
                    <button onClick={handleAddAll} className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white rounded-xl flex justify-center gap-2 font-medium"><IconShoppingCart /> Alles Einkaufen</button>
                    {selectedIngredients.length > 0 && <button onClick={handleAddSelected} className="w-full py-3 bg-emerald-100 hover:bg-emerald-200 active:bg-emerald-300 text-emerald-800 rounded-xl flex justify-center gap-2 font-medium"><IconCheck /> Ausgewählte ({selectedIngredients.length})</button>}
                  </div>
                )}
              </div>

              <div className="md:w-2/3">
                <h2 className="text-xl font-bold mb-4 flex items-center gap-2"><IconUtensils/> Zubereitung</h2>
                <div className="space-y-4">
                  {instructionsList.map((step, index) => (
                    <div key={index} className="flex gap-3">
                      <div className="shrink-0 w-7 h-7 rounded-full bg-gray-100 text-gray-600 text-sm font-bold flex items-center justify-center border mt-0.5">{index + 1}</div>
                      <p className="text-gray-700 text-sm md:text-base leading-relaxed">{step}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function WeeklyPlanView({ plan, onGenerate, recipes, onUpdateItem }) {
      const [editingSlot, setEditingSlot] = useState(null);

      return (
        <div className="max-w-4xl mx-auto pb-10">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <h2 className="text-2xl md:text-3xl font-bold text-gray-900">Wochenplan</h2>
            <button onClick={onGenerate} className="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white px-5 py-3 rounded-xl font-medium flex items-center justify-center gap-2 shadow-lg"><IconSparkles /> Füllen</button>
          </div>

          <div className="space-y-4">
            {DAYS.map(day => (
              <div key={day} className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                <div className="bg-gray-50 px-4 py-2 border-b font-bold text-gray-700">{day}</div>
                <div className="p-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
                  {RECIPE_CATEGORIES.map(cat => {
                    const isEditing = editingSlot?.day === day && editingSlot?.category === cat;
                    const currentRecipe = plan[day]?.[cat];
                    const availableRecipes = recipes.filter(r => r.category === cat);

                    return (
                      <div key={cat} className="flex flex-col relative">
                        <span className="text-[10px] md:text-xs text-gray-400 font-semibold uppercase mb-1">{cat}</span>
                        {isEditing ? (
                          <select autoFocus className="w-full p-2 text-sm border rounded-lg bg-white min-h-[44px]" value={currentRecipe ? currentRecipe.id : ''} onChange={(e) => { onUpdateItem(day, cat, e.target.value); setEditingSlot(null); }} onBlur={() => setEditingSlot(null)}>
                            <option value="">-- Frei --</option>
                            {availableRecipes.map(r => <option key={r.id} value={r.id}>{r.title}</option>)}
                          </select>
                        ) : (
                          <button
                            type="button"
                            onClick={() => setEditingSlot({ day, category: cat })}
                            aria-label={`${cat} am ${day} bearbeiten${currentRecipe ? `, aktuell ${currentRecipe.title}` : ', aktuell frei'}`}
                            className={`w-full min-h-[44px] flex items-center text-left p-2 rounded-lg text-sm border font-medium truncate active:bg-gray-100 ${currentRecipe ? getCatStyle(cat) : 'border-dashed text-gray-400 italic'}`}
                          >
                            {currentRecipe ? currentRecipe.title : 'Frei'}
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ShoppingListView({ items, categoryOrder, onToggle, onRemove, onClear, onChangeCategory, onMoveCategory, onAddManualItem }) {
      const [manualInput, setManualInput] = useState('');
      const [isListening, setIsListening] = useState(false);
      const recognitionRef = useRef(null);

      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          recognitionRef.current = new SpeechRecognition();
          recognitionRef.current.lang = 'de-DE';
          recognitionRef.current.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            setManualInput(transcript); onAddManualItem(transcript); setManualInput(''); setIsListening(false);
          };
          recognitionRef.current.onerror = () => setIsListening(false);
          recognitionRef.current.onend = () => setIsListening(false);
        }
      }, []);

      const toggleListen = () => {
        if (isListening) { recognitionRef.current?.stop(); setIsListening(false); }
        else if (recognitionRef.current) { recognitionRef.current.start(); setIsListening(true); }
        else alert("Spracherkennung wird auf diesem Gerät nicht unterstützt.");
      };

      const handleManualSubmit = (e) => { e.preventDefault(); if (manualInput.trim()) { onAddManualItem(manualInput); setManualInput(''); } };

      const handleCopy = () => {
        let text = "Einkaufsliste:\n\n";
        categoryOrder.forEach(cat => {
          const catItems = items.filter(i => i.category === cat && !i.checked);
          if (catItems.length > 0) {
            text += `--- ${cat} ---\n`; catItems.forEach(i => text += `- ${i.text}\n`); text += "\n";
          }
        });
        if(navigator.clipboard) navigator.clipboard.writeText(text);
      };

      return (
        <div className="max-w-4xl mx-auto pb-10">
          <div className="flex justify-between items-center mb-4">
            <h2 className="text-2xl md:text-3xl font-bold text-gray-900">Einkaufsliste</h2>
            <div className="flex gap-2">
              <button onClick={handleCopy} aria-label="Einkaufsliste kopieren" className="p-3 bg-white border rounded-xl active:bg-gray-100 tap-target"><IconCopy /></button>
              <button onClick={onClear} aria-label="Einkaufsliste leeren" className="p-3 bg-white border border-red-200 text-red-500 rounded-xl active:bg-red-50 tap-target"><IconTrash2 /></button>
            </div>
          </div>

          <form onSubmit={handleManualSubmit} className="mb-6 flex gap-2">
            <div className="relative flex-1">
              <label htmlFor="shopping-manual-input" className="sr-only">Zutat zur Einkaufsliste hinzufügen</label>
              <input id="shopping-manual-input" type="text" value={manualInput} onChange={(e) => setManualInput(e.target.value)} placeholder="Zutat hinzufügen..." className={`w-full pl-4 pr-4 py-3 rounded-xl border shadow-sm ${isListening ? 'bg-red-50 border-red-300' : 'bg-white'}`} />
            </div>
            <button type="button" onClick={toggleListen} aria-pressed={isListening} aria-label={isListening ? 'Spracherkennung stoppen' : 'Spracherkennung starten'} className={`px-4 rounded-xl shadow-sm tap-target ${isListening ? 'bg-red-500 text-white animate-pulse' : 'bg-white border active:bg-gray-100'}`}>{isListening ? <IconMicOff /> : <IconMic />}</button>
            <button type="submit" disabled={!manualInput.trim() && !isListening} aria-label="Zutat hinzufügen" className="bg-emerald-600 active:bg-emerald-800 text-white px-4 rounded-xl shadow-sm disabled:opacity-50 tap-target"><IconPlus /></button>
          </form>

          {items.length === 0 ? (
            <div className="py-20 text-center text-gray-400"><IconShoppingCart size={48} /><p>Liste ist leer.</p></div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {categoryOrder.map((cat, catIndex) => {
                const catItems = items.filter(item => item.category === cat);
                if (catItems.length === 0) return null;
                return (
                  <div key={cat} className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                    <div className="bg-gray-50 px-3 py-2 border-b flex items-center justify-between gap-2">
                      <h3 className="font-bold text-sm text-gray-700 truncate">{cat}</h3>
                      <div className="flex items-center gap-1 shrink-0">
                        <button
                          type="button"
                          onClick={() => onMoveCategory(cat, -1)}
                          disabled={catIndex === 0}
                          aria-label={`${cat} nach oben verschieben`}
                          className="p-2 -m-1 rounded-lg text-gray-400 active:bg-gray-200 disabled:opacity-30 disabled:pointer-events-none tap-target"
                        ><IconChevronLeft size={16} className="rotate-90" /></button>
                        <button
                          type="button"
                          onClick={() => onMoveCategory(cat, 1)}
                          disabled={catIndex === categoryOrder.length - 1}
                          aria-label={`${cat} nach unten verschieben`}
                          className="p-2 -m-1 rounded-lg text-gray-400 active:bg-gray-200 disabled:opacity-30 disabled:pointer-events-none tap-target"
                        ><IconChevronLeft size={16} className="-rotate-90" /></button>
                      </div>
                    </div>
                    <ul className="p-1">
                      {catItems.map(item => (
                        <li key={item.id} className="flex items-center gap-2 p-2 hover:bg-gray-50">
                          <button onClick={() => onToggle(item.id)} aria-pressed={item.checked} aria-label={`${item.checked ? 'Als nicht erledigt markieren' : 'Als erledigt markieren'}: ${item.text}`} className="p-2 -m-2 rounded-full tap-target shrink-0">
                            <span className={`block w-6 h-6 rounded-full border-2 flex items-center justify-center ${item.checked ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-gray-300'}`}>{item.checked && <IconCheck />}</span>
                          </button>
                          <span className={`flex-1 min-w-0 break-words text-sm md:text-base ${item.checked ? 'text-gray-400 line-through' : 'text-gray-700'}`}>{item.text}</span>
                          <div className="relative shrink-0">
                            <select
                              id={`cat-select-${item.id}`}
                              value={item.category}
                              onChange={(e) => onChangeCategory(item.id, e.target.value, item.text)}
                              aria-label={`Kategorie für ${item.text} ändern`}
                              className="appearance-none max-w-[112px] truncate text-xs font-medium pl-2.5 pr-6 py-2 rounded-full border border-gray-200 bg-gray-50 text-gray-600 active:bg-gray-100"
                            >
                              {DEFAULT_SHOPPING_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                            <IconChevronLeft size={12} className="rotate-[-90deg] pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-gray-400" />
                          </div>
                          <button onClick={() => onRemove(item.id)} aria-label={`${item.text} entfernen`} className="text-gray-300 hover:text-red-500 active:text-red-500 p-2.5 -m-1 rounded-full tap-target"><IconX size={16} /></button>
                        </li>
                      ))}
                    </ul>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function AddRecipeModal({ onClose, onSave, apiKey, model, initialRecipe }) {
      const isEditing = !!initialRecipe;
      const canUseAI = !!apiKey;
      const [tab, setTab] = useState(isEditing ? 'manual' : 'ai');
      const [aiSubMode, setAiSubMode] = useState('dish');
      const [title, setTitle] = useState(initialRecipe?.title || '');
      const [category, setCategory] = useState(initialRecipe?.category || 'Hauptspeise');
      const [time, setTime] = useState(initialRecipe?.time || '');
      const [servings, setServings] = useState(initialRecipe?.servings || '');
      const [ingredients, setIngredients] = useState((initialRecipe?.ingredients || []).join('\n'));
      const [instructions, setInstructions] = useState(initialRecipe?.instructions || '');
      const [pasteText, setPasteText] = useState('');
      const [dishName, setDishName] = useState('');
      const [aiLoading, setAiLoading] = useState(false);
      const [aiError, setAiError] = useState('');
      const modalRef = useRef(null);

      useEffect(() => {
        const previouslyFocused = document.activeElement;
        const focusablesSelector = 'a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])';
        modalRef.current?.querySelectorAll(focusablesSelector)?.[0]?.focus();
        document.body.style.overflow = 'hidden';
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') { onClose(); return; }
          if (e.key === 'Tab' && modalRef.current) {
            const focusables = Array.from(modalRef.current.querySelectorAll(focusablesSelector));
            if (!focusables.length) return;
            const first = focusables[0], last = focusables[focusables.length - 1];
            if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
            else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
          }
        };
        document.addEventListener('keydown', handleKeyDown);
        return () => {
          document.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = '';
          previouslyFocused?.focus?.();
        };
      }, [onClose]);

      const applyAiResult = (result, fallbackTitle) => {
        setTitle(result.title || fallbackTitle || '');
        setCategory(RECIPE_CATEGORIES.includes(result.category) ? result.category : 'Hauptspeise');
        setTime(result.time || '');
        setIngredients((result.ingredients || []).join('\n'));
        setInstructions(result.instructions || '');
        setTab('manual');
      };

      const runAiExtraction = async (prompt, fallbackTitle, imagePart) => {
        if (aiLoading) return;
        setAiLoading(true); setAiError('');
        try {
          const result = await callGemini(apiKey, model, prompt, RECIPE_SCHEMA, imagePart);
          applyAiResult(result, fallbackTitle);
        } catch (e) {
          setAiError(e.message || 'Unbekannter Fehler bei der KI-Anfrage.');
        } finally {
          setAiLoading(false);
        }
      };

      const handleAiSuggest = () => {
        if (!dishName.trim()) return;
        runAiExtraction(buildRecipePrompt(dishName.trim()), dishName.trim());
      };

      const handleAiPasteExtract = () => {
        if (!pasteText.trim()) return;
        runAiExtraction(buildPasteExtractPrompt(pasteText.trim()));
      };

      const handleAiPhotoExtract = async (file) => {
        if (!file || aiLoading) return;
        setAiLoading(true); setAiError('');
        try {
          const imagePart = await fileToImagePart(file);
          const result = await callGemini(apiKey, model, buildPhotoExtractPrompt(), RECIPE_SCHEMA, imagePart);
          applyAiResult(result);
        } catch (e) {
          setAiError(e.message || 'Unbekannter Fehler bei der KI-Anfrage.');
        } finally {
          setAiLoading(false);
        }
      };

      const handleAiImprove = async () => {
        if (aiLoading) return;
        setAiLoading(true); setAiError('');
        try {
          const current = { title, category, time, ingredients: ingredients.split('\n').map(i => i.trim()).filter(Boolean), instructions };
          const result = await callGemini(apiKey, model, buildImprovePrompt(current), RECIPE_SCHEMA);
          applyAiResult(result, title);
        } catch (e) {
          setAiError(e.message || 'Unbekannter Fehler bei der KI-Anfrage.');
        } finally {
          setAiLoading(false);
        }
      };

      const handleSave = (e) => {
        e.preventDefault();
        onSave({
          ...(isEditing ? { id: initialRecipe.id } : {}),
          title: title.trim(), category, time: time.trim(), servings: servings.trim(),
          ingredients: ingredients.split('\n').map(i => i.trim()).filter(i => i),
          instructions,
        });
      };

      return (
        <div className="fixed inset-0 bg-gray-900/60 z-50 flex items-center justify-center p-4">
          <div ref={modalRef} role="dialog" aria-modal="true" aria-labelledby="add-recipe-title" className="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
            <div className="flex justify-between items-center p-4 md:p-6 border-b">
              <h2 id="add-recipe-title" className="text-xl font-bold">{isEditing ? 'Rezept bearbeiten' : 'Neues Rezept'}</h2>
              <button onClick={onClose} aria-label="Schließen" className="p-2 -m-2 rounded-full active:bg-gray-100 tap-target"><IconX /></button>
            </div>
            {!isEditing && (
              <div className="flex border-b">
                <button className={`flex-1 py-3 text-sm font-medium ${tab === 'ai' ? 'border-b-2 border-emerald-500 text-emerald-600' : 'text-gray-500 active:bg-gray-50'}`} onClick={() => setTab('ai')}>KI-Import</button>
                <button className={`flex-1 py-3 text-sm font-medium ${tab === 'manual' ? 'border-b-2 border-emerald-500 text-emerald-600' : 'text-gray-500 active:bg-gray-50'}`} onClick={() => setTab('manual')}>Manuell</button>
              </div>
            )}
            <div className="p-4 md:p-6 overflow-y-auto flex-1">
              {tab === 'ai' && !isEditing ? (
                <div className="flex flex-col gap-4">
                  {!canUseAI ? (
                    <p className="text-sm text-gray-500">Kein Gemini API-Key hinterlegt. Füge einen über das Zahnrad-Symbol (KI-Einstellungen) hinzu, um dir Rezepte automatisch erstellen zu lassen.</p>
                  ) : (
                    <>
                      <div className="inline-flex gap-1 p-1 bg-gray-100 rounded-xl self-start">
                        <button type="button" onClick={() => setAiSubMode('dish')} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${aiSubMode === 'dish' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500'}`}>Gericht</button>
                        <button type="button" onClick={() => setAiSubMode('paste')} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${aiSubMode === 'paste' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500'}`}>Text einfügen</button>
                        <button type="button" onClick={() => setAiSubMode('photo')} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${aiSubMode === 'photo' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500'}`}>Foto</button>
                      </div>

                      {aiSubMode === 'dish' && (
                        <>
                          <label htmlFor="dish-name" className="sr-only">Gericht</label>
                          <input id="dish-name" type="text" value={dishName} onChange={e => setDishName(e.target.value)} placeholder="z.B. Gebratener Reis mit Gemüse" className="w-full p-3 border rounded-xl" />
                          <button type="button" onClick={handleAiSuggest} disabled={!dishName.trim() || aiLoading} className="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 disabled:opacity-50">
                            <IconSparkles size={18} className={aiLoading ? 'animate-spin' : ''} /> {aiLoading ? 'Wird generiert…' : 'Rezept vorschlagen'}
                          </button>
                        </>
                      )}

                      {aiSubMode === 'paste' && (
                        <>
                          <label htmlFor="paste-text" className="sr-only">Rezepttext zum Einfügen</label>
                          <textarea id="paste-text" value={pasteText} onChange={e => setPasteText(e.target.value)} placeholder="Rezepttext hier einfügen..." className="w-full p-3 border rounded-xl min-h-[160px]" />
                          <button type="button" onClick={handleAiPasteExtract} disabled={!pasteText.trim() || aiLoading} className="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 disabled:opacity-50">
                            <IconSparkles size={18} className={aiLoading ? 'animate-spin' : ''} /> {aiLoading ? 'Wird analysiert…' : 'Text analysieren'}
                          </button>
                        </>
                      )}

                      {aiSubMode === 'photo' && (
                        <>
                          <p className="text-sm text-gray-500">Fotografiere eine Rezeptseite oder wähle ein Bild aus.</p>
                          <label className="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50" aria-disabled={aiLoading}>
                            <IconCamera size={18} className={aiLoading ? 'animate-spin' : ''} /> {aiLoading ? 'Wird ausgelesen…' : 'Foto auswählen'}
                            <input type="file" accept="image/*" capture="environment" disabled={aiLoading} onChange={e => { const file = e.target.files?.[0]; e.target.value = ''; if (file) handleAiPhotoExtract(file); }} className="hidden" />
                          </label>
                        </>
                      )}

                      {aiError && <p className="text-sm text-red-600">{aiError}</p>}
                    </>
                  )}
                </div>
              ) : (
                <form id="recipe-form" onSubmit={handleSave} className="space-y-4">
                  <label htmlFor="recipe-title" className="sr-only">Rezepttitel</label>
                  <input id="recipe-title" required type="text" value={title} onChange={e => setTitle(e.target.value)} className="w-full p-3 border rounded-xl" placeholder="Titel" />
                  <div className="flex flex-wrap gap-3">
                    <label htmlFor="recipe-category" className="sr-only">Kategorie</label>
                    <select id="recipe-category" value={category} onChange={e => setCategory(e.target.value)} className="flex-1 min-w-[120px] p-3 border rounded-xl">{RECIPE_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}</select>
                    <label htmlFor="recipe-time" className="sr-only">Zubereitungszeit</label>
                    <input id="recipe-time" type="text" value={time} onChange={e => setTime(e.target.value)} className="w-20 p-3 border rounded-xl" placeholder="Dauer" />
                    <label htmlFor="recipe-servings" className="sr-only">Portionen</label>
                    <input id="recipe-servings" type="text" value={servings} onChange={e => setServings(e.target.value)} className="w-28 p-3 border rounded-xl" placeholder="Portionen" />
                  </div>
                  <label htmlFor="recipe-ingredients" className="sr-only">Zutaten, eine pro Zeile</label>
                  <textarea id="recipe-ingredients" required value={ingredients} onChange={e => setIngredients(e.target.value)} rows={4} className="w-full p-3 border rounded-xl" placeholder="Zutaten (eine pro Zeile)" />
                  <label htmlFor="recipe-instructions" className="sr-only">Zubereitung</label>
                  <textarea id="recipe-instructions" value={instructions} onChange={e => setInstructions(e.target.value)} rows={6} className="w-full p-3 border rounded-xl" placeholder="Zubereitung" />
                  {canUseAI && (
                    <button type="button" onClick={handleAiImprove} disabled={aiLoading || !title.trim()} className="w-full bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 text-indigo-700 py-3 rounded-xl font-medium flex items-center justify-center gap-2 disabled:opacity-50">
                      <IconSparkles size={16} className={aiLoading ? 'animate-spin' : ''} /> {aiLoading ? 'Wird verbessert…' : 'Mit KI verbessern'}
                    </button>
                  )}
                  {aiError && <p className="text-sm text-red-600">{aiError}</p>}
                </form>
              )}
            </div>
            {tab === 'manual' && <div className="p-4 border-t bg-gray-50"><button type="submit" form="recipe-form" className="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white py-3 rounded-xl font-bold">{isEditing ? 'Änderungen speichern' : 'Speichern'}</button></div>}
          </div>
        </div>
      );
    }

    function AiSettingsModal({ apiKey, model, onSave, onClose }) {
      const [localKey, setLocalKey] = useState(apiKey || '');
      const [localModel, setLocalModel] = useState(model);
      const modalRef = useRef(null);

      useEffect(() => {
        const previouslyFocused = document.activeElement;
        const focusablesSelector = 'a[href], button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])';
        modalRef.current?.querySelectorAll(focusablesSelector)?.[0]?.focus();
        document.body.style.overflow = 'hidden';
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') { onClose(); return; }
          if (e.key === 'Tab' && modalRef.current) {
            const focusables = Array.from(modalRef.current.querySelectorAll(focusablesSelector));
            if (!focusables.length) return;
            const first = focusables[0], last = focusables[focusables.length - 1];
            if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
            else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
          }
        };
        document.addEventListener('keydown', handleKeyDown);
        return () => {
          document.removeEventListener('keydown', handleKeyDown);
          document.body.style.overflow = '';
          previouslyFocused?.focus?.();
        };
      }, [onClose]);

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave(localKey.trim(), localModel);

      return (

          <div ref={modalRef} role="dialog" aria-modal="true" aria-labelledby="ai-settings-title" className="bg-white rounded-2xl w-full max-w-md flex flex-col">
            <div className="flex justify-between items-center p-4 md:p-6 border-b">
              <h2 id="ai-settings-title" className="text-xl font-bold">KI-Einstellungen</h2>
              <button onClick={onClose} aria-label="Schließen" className="p-2 -m-2 rounded-full active:bg-gray-100 tap-target"><IconX /></button>
            </div>
            <form onSubmit={handleSubmit} className="p-4 md:p-6 space-y-4">
              <div>
                <label htmlFor="gemini-key" className="block text-sm font-medium text-gray-700 mb-1">Gemini API-Key</label>
                <input id="gemini-key" type="password" autoComplete="off" value={localKey} onChange={e => setLocalKey(e.target.value)} placeholder="AIza…" className="w-full p-3 border rounded-xl" />
                <p className="text-xs text-gray-400 mt-1">Wird nur lokal in diesem Browser gespeichert und direkt von hier an Google gesendet.</p>
              </div>
              <div>
                <label htmlFor="gemini-model" className="block text-sm font-medium text-gray-700 mb-1">Modell</label>
                <select id="gemini-model" value={localModel} onChange={e => setLocalModel(e.target.value)} className="w-full p-3 border rounded-xl">
                  {GEMINI_MODELS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                </select>
              </div>
              <div className="flex gap-2 pt-2">
                {apiKey && <button type="button" onClick={handleRemoveKey} className="flex-1 py-3 bg-red-50 hover:bg-red-100 active:bg-red-200 text-red-600 rounded-xl font-medium">Key entfernen</button>}
                <button type="submit" className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white rounded-xl font-bold">Speichern</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
